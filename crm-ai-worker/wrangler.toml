name = "bring-crm-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true
preview_urls = false

[vars]
AI_ENABLED = "true"
GROQ_MODEL = "qwen/qwen3.8-27b"
AI_COMPANY_DAILY_LIMIT = "1000"
CRM_ALLOWED_EMAILS = "dpvld858@gmail.com,ameejin92@gmail.com"
CRM_ADMIN_EMAILS = "dpvld858@gmail.com,ameejin92@gmail.com"
ALLOWED_ORIGINS = "app://bring-crm"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "10081"

[ratelimits.simple]
limit = 20
period = 60

[[kv_namespaces]]
binding = "AI_USAGE"
id = "d62c9d8a0f9a487495da8a3f915ac083"
