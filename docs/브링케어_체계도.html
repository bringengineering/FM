<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브링케어 체계도 v1.0</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #121829;
    --panel-2: #1a2138;
    --line: #2a3350;
    --text: #e6ebf5;
    --text-dim: #8b96b0;
    --text-faint: #5c6580;
    --warn: #f0a132;
    --gap-bg: #2a1a1a;
    --gap-line: #6b3535;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 상단 바 ---------- */
  #bar {
    position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 100;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: rgba(10,14,26,.92); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  #bar { flex-wrap: nowrap; overflow-x: auto; }
  #bar h1 { font-size: 14px; margin: 0; letter-spacing: -.2px; white-space: nowrap; flex: 0 0 auto; }
  #search { flex: 0 1 200px; }
  #status { flex: 0 0 auto; white-space: nowrap; }
  #bar h1 small { color: var(--text-faint); font-weight: 400; margin-left: 6px; }
  #search {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 10px; width: 200px; font: inherit;
  }
  #search::placeholder { color: var(--text-faint); }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 6px; padding: 6px 11px; cursor: pointer; font: inherit;
    white-space: nowrap; flex: 0 0 auto;
  }
  .btn:hover { color: var(--text); border-color: #3d4970; }
  #status { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--text-dim); font-size: 12px; }
  #status b { color: var(--warn); font-variant-numeric: tabular-nums; }

  /* ---------- 캔버스 ---------- */
  #stage { position: fixed; inset: 52px 0 0 0; overflow: hidden; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #canvas { transform-origin: 0 0; padding: 44px 44px 72px; width: max-content; position: relative; }

  /* 루트에서 각 축으로 뻗는 배선 */
  #wires { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
  #wires path { fill: none; stroke: #55648f; stroke-width: 1.4; }

  /* ---------- 루트 ---------- */
  .root {
    position: relative; z-index: 1; width: 380px; margin: 0 auto 76px;
    background: linear-gradient(180deg, #1b2540, #141b30);
    border: 1px solid #46567f; border-radius: 12px; padding: 14px 18px 15px;
    box-shadow: 0 0 0 1px rgba(120,150,220,.09), 0 8px 34px rgba(0,0,0,.5);
    text-align: center;
  }
  .root h2 { margin: 0 0 5px; font-size: 19px; letter-spacing: 1.2px; }
  .root .vis { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }
  .root .sum {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid #2c375a;
    display: flex; justify-content: center; gap: 14px; font-size: 10.5px; color: var(--text-faint);
  }
  .root .sum b { color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .axes { display: flex; gap: 26px; align-items: flex-start; position: relative; z-index: 1; }

  /* ---------- 축 ---------- */
  .axis { width: 560px; flex: 0 0 auto; }
  .axis-panel {
    border: 1px solid var(--ac-line); border-radius: 14px; padding: 13px;
    background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(0,0,0,.16));
  }
  .axis-body { display: flex; gap: 13px; align-items: flex-start; }
  .col-tree { flex: 0 0 232px; width: 232px; }
  .col-cards { flex: 1; min-width: 0; }

  /* ---------- 축 컬럼 ---------- */
  .axis-head {
    border-radius: 10px; padding: 11px 14px; margin-bottom: 13px;
    background: var(--ac-bg); border: 1px solid var(--ac-line);
    display: flex; align-items: baseline; gap: 8px;
    box-shadow: 0 0 22px -8px var(--ac-fg), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .axis-head .code { font-size: 15px; font-weight: 700; color: var(--ac-fg); letter-spacing: .3px; }
  .axis-head .ko { font-size: 12px; color: var(--text-dim); }
  .axis-head .badge {
    margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
    padding: 2px 7px; border-radius: 20px; background: rgba(0,0,0,.3); color: var(--text-dim);
  }
  .axis-head .badge.gap { background: var(--gap-bg); color: var(--warn); border: 1px solid var(--gap-line); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 13px; margin-bottom: 10px;
  }
  .card > .t {
    font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    color: var(--ac-fg); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .card.principle { border-left: 3px solid var(--ac-fg); }
  .card.problem { border-left: 3px solid #8a4a4a; }
  .card.problem > .t { color: #d98a8a; }
  .card ul { margin: 0; padding-left: 16px; }
  .card li { margin-bottom: 5px; color: var(--text-dim); }
  .card li:last-child { margin-bottom: 0; }
  .card li b { color: var(--text); font-weight: 600; }
  .card li .src { color: var(--text-faint); font-size: 11px; }

  /* ---------- 트리 ---------- */
  .tree { padding-left: 2px; }
  .tgroup { margin-bottom: 9px; }
  .tgroup > .gh {
    background: var(--ac-node); border: 1px solid var(--ac-line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text);
  }
  .tgroup > .items { margin: 4px 0 0 13px; padding-left: 13px; border-left: 1px solid var(--line); }
  .tgroup > .items > div {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 9px; margin: 3px 0; font-size: 11.5px; color: var(--text-dim);
    position: relative;
  }
  .tgroup > .items > div::before {
    content: ""; position: absolute; left: -14px; top: 50%; width: 13px; height: 1px; background: var(--line);
  }
  .tgroup > .items > div.empty { border-style: dashed; border-color: var(--gap-line); color: #b07a5a; }

  /* ---------- 지표표 ---------- */
  table.kpi { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.kpi th {
    text-align: left; font-weight: 600; color: var(--text-faint); font-size: 10.5px;
    padding: 0 4px 5px; border-bottom: 1px solid var(--line);
  }
  table.kpi td { padding: 5px 4px; border-bottom: 1px solid rgba(42,51,80,.5); vertical-align: top; }
  table.kpi tr:last-child td { border-bottom: 0; }
  table.kpi .name { color: var(--text); line-height: 1.45; }
  table.kpi .name em {
    display: block; font-style: normal; color: var(--text-faint);
    font-size: 10px; margin-top: 2px;
  }
  table.kpi .goal { color: var(--text-dim); white-space: nowrap; }
  table.kpi input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; color: var(--text); padding: 3px 6px; font: inherit; min-width: 54px;
  }
  table.kpi input:focus { outline: none; border-color: var(--ac-fg); }
  table.kpi input.blank { border-style: dashed; border-color: var(--gap-line); background: rgba(42,26,26,.4); }
  .tag {
    display: inline-block; font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-faint);
    white-space: nowrap; letter-spacing: .2px;
  }
  .tag.crm { color: #6ba8e8; border-color: #2d4d70; }
  .tag.doc { color: #7fb894; border-color: #2f5540; }
  .tag.none { color: var(--warn); border-color: var(--gap-line); }

  /* ---------- 책 커버리지 ---------- */
  table.cov { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.cov td { padding: 4px 4px; border-bottom: 1px solid rgba(42,51,80,.5); vertical-align: top; }
  table.cov tr:last-child td { border-bottom: 0; }
  table.cov .no { color: var(--text-faint); font-variant-numeric: tabular-nums; width: 22px; }
  table.cov .ti { color: var(--text); }
  table.cov .ti em { display: block; color: var(--text-faint); font-size: 10.5px; font-style: normal; }
  .st { display: inline-block; font-size: 9.5px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; border: 1px solid; }
  .st.have { color: #7fb894; border-color: #2f5540; background: rgba(47,85,64,.18); }
  .st.part { color: #d9b45a; border-color: #5c4820; background: rgba(92,72,32,.18); }
  .st.none { color: #d98a8a; border-color: #6b3535; background: rgba(107,53,53,.18); }
  .st.na   { color: var(--text-faint); border-color: var(--line); }

  /* ---------- 진입 가능 노드 ---------- */
  [data-nid] { cursor: pointer; }
  [data-nid] .enter {
    float: right; color: var(--text-faint); font-size: 11px; opacity: 0; transition: opacity .12s;
    margin-left: 6px;
  }
  [data-nid]:hover .enter { opacity: 1; }
  [data-nid]:hover { border-color: var(--ac-fg, #6b7794) !important; }
  .cc {
    float: right; margin-left: 6px; font-size: 9.5px; font-variant-numeric: tabular-nums;
    background: var(--ac-fg, #6b7794); color: #0a0e1a; border-radius: 20px;
    padding: 0 5px; font-weight: 700; line-height: 15px;
  }
  .cc.only-note { background: transparent; color: var(--ac-fg, #6b7794); font-size: 14px; padding: 0 3px; }

  /* ---------- 드릴다운 패널 ---------- */
  #drill {
    position: fixed; inset: 52px 0 0 0; z-index: 200; display: none;
    background: rgba(6,9,17,.72); backdrop-filter: blur(3px);
    padding: 24px; overflow: auto;
  }
  #drill.on { display: block; }
  #drillBox {
    max-width: 760px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 22px;
  }
  #crumb { font-size: 11.5px; color: var(--text-faint); margin-bottom: 12px; line-height: 1.9; }
  #crumb span.c { color: var(--text-dim); cursor: pointer; }
  #crumb span.c:hover { color: var(--text); text-decoration: underline; }
  #crumb span.sep { margin: 0 5px; color: var(--line); }
  #crumb span.cur { color: var(--text); }
  #drillTitle {
    font-size: 17px; font-weight: 700; width: 100%; background: transparent;
    border: 0; border-bottom: 1px dashed transparent; color: var(--text);
    font-family: inherit; padding: 2px 0; margin-bottom: 4px;
  }
  #drillTitle:focus { outline: none; border-bottom-color: var(--line); }
  #drillTitle[readonly] { cursor: default; }
  #drillHint { font-size: 11px; color: var(--text-faint); margin-bottom: 16px; }

  .sec { margin-top: 18px; }
  .sec > h3 {
    font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    color: var(--text-dim); margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .sec > h3 .add {
    margin-left: auto; font-size: 11px; text-transform: none; letter-spacing: 0;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 5px; padding: 3px 9px; cursor: pointer; font-family: inherit;
  }
  .sec > h3 .add:hover { color: var(--text); border-color: #3d4970; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .row input, .row textarea {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 5px; padding: 6px 9px; font: inherit; min-width: 0;
  }
  .row input:focus, .row textarea:focus { outline: none; border-color: #4d5c8a; }
  .row input.k-goal, .row input.k-cur { flex: 0 0 118px; }
  .row .ib {
    flex: 0 0 auto; background: transparent; border: 1px solid transparent; color: var(--text-faint);
    border-radius: 5px; padding: 4px 7px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .row .ib:hover { color: var(--text); border-color: var(--line); background: var(--panel-2); }
  .row .ib.del:hover { color: #d98a8a; border-color: #6b3535; }
  .row .cc { float: none; margin: 0 2px 0 0; }
  #drillNote {
    width: 100%; min-height: 62px; resize: vertical; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--text); border-radius: 6px;
    padding: 8px 10px; font: inherit;
  }
  #drillNote:focus { outline: none; border-color: #4d5c8a; }
  .none-yet { color: var(--text-faint); font-size: 11.5px; padding: 3px 0 1px; }

  .dim { opacity: .12; transition: opacity .15s; }
  .hit { box-shadow: 0 0 0 2px var(--warn); }
  #hint {
    position: fixed; bottom: 12px; left: 16px; z-index: 100; font-size: 11px; color: var(--text-faint);
  }
</style>
</head>
<body>

<div id="bar">
  <h1>브링케어 체계도 <small>v1.0 · 운영 판단맵</small></h1>
  <input id="search" placeholder="검색 — 노드·지표·질문">
  <button class="btn" id="fit">한 화면</button>
  <button class="btn" id="reset">100%</button>
  <button class="btn" id="gapsOnly">공백만</button>
  <button class="btn" id="export">내보내기</button>
  <button class="btn" id="importBtn">불러오기</button>
  <input type="file" id="importFile" accept=".json" hidden>
  <div id="status">
    <span>미기입 지표 <b id="cnt">0</b>개</span>
    <span id="cov"></span>
    <span id="saved"></span>
  </div>
</div>

<div id="stage"><div id="canvas"></div></div>

<div id="drill"><div id="drillBox">
  <div id="crumb"></div>
  <input id="drillTitle">
  <div id="drillHint"></div>
  <textarea id="drillNote" placeholder="이 항목에 대한 판단 기준·메모 — 왜 이게 중요한가, 무엇이 완료인가"></textarea>

  <div class="sec"><h3>하위 체계 <button class="add" data-add="children">+ 항목</button></h3><div id="secChildren"></div></div>
  <div class="sec"><h3>점검 질문 <button class="add" data-add="q">+ 질문</button></h3><div id="secQ"></div></div>
  <div class="sec"><h3>자주 나는 문제 <button class="add" data-add="p">+ 문제</button></h3><div id="secP"></div></div>
  <div class="sec"><h3>지표 <button class="add" data-add="k">+ 지표</button></h3><div id="secK"></div></div>
</div></div>

<div id="hint">항목 클릭 = 안으로 들어가기 · 드래그 = 이동 · 휠 = 확대/축소 · Esc = 상위로</div>

<script>
// ============================================================
// 데이터 — 근거: 브링엔지니어링 비전 및 목표.pdf / 브링케어 마스터 운영매뉴얼 v0.9 / 바탕화면 폴더 구조
// ============================================================
const AXES = [
  {
    code: "CORE", ko: "기준 · 조직 · 위임",
    fg: "#a78bfa", bg: "#1e1a3a", line: "#3d3170", node: "#2a2450",
    principle: [
      "<b>서비스를 판매하는 회사가 아니라 운영의 기준(Standard)을 만드는 회사</b> — 브링케어의 미션.",
      "대표가 없으면 멈추는 결정은 <b>기준이 없는 결정</b>이다. 위임의 단위는 사람이 아니라 승인 한도다.",
      "<b>완료의 정의</b> — 결과 작동확인 + 고객안내 + 비용·승인 + 전후증빙 + 미결 후속일이 모두 기록된 상태."
    ],
    tree: [
      { g: "운영 4원칙", items: ["공실 시계 — 퇴실 통보 순간부터", "단일 기록 — 티켓·담당·기한·증빙", "판단 분리 — 관찰→원인→책임→비용", "완료의 정의"] },
      { g: "성장 단계", items: ["현재 S0 — 6동 검증 전", "S1 신뢰받는 운영 (BEP 35~40동)", "S2 데이터 기반 운영 (투자·100동)", "S3 지역 확장 (춘천)"] },
      { g: "조직 · 위임 경계", items: ["역할별 단독수행 / 승인·이관", "금액·안전·분쟁·개인정보 승인권자", { t: "대표 없이 운영 비율 정의", empty: true }, { t: "초기멤버 역할·보상·지분", empty: true }] },
      { g: "기준 문서", items: ["운영매뉴얼 v0.9 (BC-OPS-MAN-001)", "지각관리기준", { t: "권한·보안 기준", empty: true }, { t: "인사·평가 기준", empty: true } ] },
      { g: "사업 5층 모델", items: ["① 시장·공실 분석", "② 지역 공동관리", "③ 공실 해결", "④ 입주자 생활서비스", "⑤ 건물 가치상승"] }
    ],
    questions: [
      "지난 한 달 <b>대표만 내릴 수 있었던 결정</b>이 몇 건인가? 투자조건은 '대표 없이 운영 80%'를 요구한다.",
      "브링케어가 지금 성장 몇 단계인가? 6동은 BEP(35~40동) 전이므로 아직 S0다.",
      "완료의 정의를 지키는 티켓 비율은? 사진 한 장·말 한마디로 완료 처리되는 건은 없나?"
    ],
    problems: [
      "<b>위임이 취향이 아니라 투자 조건이다.</b> 대표 없이 운영 80%가 통과조건인데 실무는 계속 대표에게 몰린다.",
      "<b>기준 문서가 매뉴얼·지각관리뿐.</b> 승인 한도·정보보안·인사평가가 비어 위임의 근거가 없다.",
      "<b>초기멤버 보상·지분 미합의.</b> 투자 전에 정리 안 하면 나중에 분쟁이 된다."
    ],
    kpis: [
      { n: "대표 없이 운영 비율", goal: "투자조건 80~90%", src: "none", where: "미측정 — CRM 티켓 종결 기준" },
      { n: "완료의 정의 준수율", goal: "100%", src: "crm", where: "CRM 티켓 증빙" },
      { n: "기준 문서 보유 수", goal: "핵심 5종", src: "doc", where: "브링케어 매뉴얼 + 회사기준", pre: "2 / 5" }
    ]
  },
  {
    code: "OPS", ko: "운영 — 9단계 · SOP 26종",
    fg: "#2dd4bf", bg: "#0f2a2a", line: "#1f5450", node: "#153a38",
    principle: [
      "<b>공실 시계</b> — 퇴실 통보받은 날부터 시계를 켠다. 며칠 걸렸고 어디서 막혔는지 숫자로 본다.",
      "<b>판단 분리</b> — 관찰사실 → 원인가설 → 책임판정 → 비용승인. 섞지 않는다.",
      "<b>체크리스트를 채운 것 ≠ 결과를 확인한 것.</b> 매뉴얼이 스스로 경고한 항목이다."

// 브라우저 저장 키 — 절대 바꾸지 말 것. 바꾸면 그동안 입력한 값과 하위 체계가 전부 안 보인다.
// (파일 이름·버전과 무관하게 고정)
const STORE_KEY = "bring-care-v1";
const esc = s => String(s).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

let autoSaveOk = true;

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
  catch { autoSaveOk = false; return {}; }
}

function flash(msg) {
  const el = document.getElementById("saved");
  el.textContent = msg;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { el.textContent = autoSaveOk ? "" : "자동저장 불가 — 내보내기로 보관"; }, 1600);
}

function saveStore(store) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    autoSaveOk = true;
    flash("저장됨");
  } catch {
    autoSaveOk = false;
    flash("자동저장 불가 — 내보내기로 보관");
  }
}

격 최종해석\n\n출처: 매뉴얼 v0.9 역할과 승인","children":[],"q":[],"p":[],"k":[]},"CORE/g2":{"title":"","note":"직원이 혼자 해도 되는 일과 반드시 승인·이관해야 하는 일의 경계. 이 경계가 곧 위임 가능한 범위이자 '대표 없이 운영 80%'의 실체다.","children":["CORE/g2/r0","CORE/g2/r1","CORE/g2/r2","CORE/g2/r3","CORE/g2/r4","CORE/g2/r5"],"q":[],"p":[],"k":[]},"SVC/g0/x0":{"title":"① 건물관리 — 월 89,000원","note":"기본 150,000 - 우산동 할인 61,000 = 공급가 89,000 (부가세 8,900 / 결제 97,900).\n포함: 월 2회 정기방문·공용부 육안점검·사진보고·카톡QR 문의접수·임대료 입금확인·업체연결·완료확인.\n주의: 41% 할인 구조. 권역 내 밀도가 없으면 적자.","children":[],"q":[],"p":[],"k":[]},"SVC/g0/x1":{"title":"② 공용부청소 — 월 60,000원~","note":"기본 월 4회. 층수·면적으로 최종가. 별도: 주차장·외벽·옥상·대형폐기물·공사분진·해충.","children":[],"q":[],"p":[],"k":[]},"SVC/g0/x2":{"title":"③ 입퇴실청소 — 평수별 정찰","note":"5평↓90,000/5~7평100,000/7~9평110,000/9~10평120,000/10~12평140,000(공급가). POC 10건은 80,000(VAT포함).\n원칙: 작업자가 임의로 가격 못 올린다.","children":[],"q":[],"p":[],"k":[]},"SVC/g0/x3":{"title":"④ 공간기획 — 기획비+7~10%","note":"호실 고정 기획비 / 공사관리 10% / 건물전체 별도+7~10%. 공사비 대신 수령 안 함 - 건물주·등록업체 직접계약.","children":[],"q":[],"p":[],"k":[]},"SVC/g0/x4":{"title":"⑤ 전문작업 관리 — 5%","note":"업체·견적·일정·완료 확인. VEN-02의 유료화.","children":[],"q":[],"p":[],"k":[]},"SVC/g0/x5":{"title":"추가 현장방문","note":"비긴급·개인사정·열쇠전달·야간주말 = 각 20,000원. 입퇴실·공실·중개 확인 = 출동비 없음.","children":[],"q":[],"p":[],"k":[]},"SVC/g0":{"title":"","note":"제안서 확정 가격. 부가세 별도 표기 없으면 별도.\n출처: BRING 서비스제안서 (2026.08, 우산동)","children":["SVC/g0/x0","SVC/g0/x1","SVC/g0/x2","SVC/g0/x3","SVC/g0/x4","SVC/g0/x5"],"q":["기본요금 150,000원을 실제로 받은 건물이 있나?","월 2회x89,000이면 방문당 44,500원 - 이동 포함 실투입이 들어오나?"],"p":["할인가가 정가가 된다.","평수별 정찰제는 실측 기준이 없으면 현장에서 다툰다."],"k":[]},"SVC/g1/x0":{"title":"하는 일","note":"육안확인·사진기록·보고 / 문의접수·건물주 전달 / 업체 연결·완료 확인 / 입퇴실·공실 현장정보 관리","children":[],"q":[],"p":[],"k":[]},"SVC/g1/x1":{"title":"하지 않는 일","note":"전문 시설진단·법정검사 / 분쟁중재·법률상담·채권추심 / 전기·소방·가스·설비 직접수리 / 보증금차감·원상복구 책임판단","children":[],"q":[],"p":[],"k":[]},"SVC/g1/x2":{"title":"청소 재작업 경계","note":"브링 작업누락·명백한 미흡은 무상 재확인. 청소 후 새 오염·외부공사·기상 오염은 재청소 대상 아님.","children":[],"q":[],"p":[],"k":[]},"SVC/g1/x3":{"title":"공간기획 책임 분리","note":"브링: 콘셉트·투자순위·예산, 업체비교·일정관리, 완료보고. 시공업체: 공사방법·품질·안전·자재·하자·면허.","children":[],"q":[],"p":[],"k":[]},"SVC/g1":{"title":"","note":"GOV-01의 '무제한 표현 금지'와 책임경계 공개가 문서화된 부분. 상담 3문장 ③의 근거.\n출처: BRING 서비스제안서 (2026.08, 우산동)","children":["SVC/g1/x0","SVC/g1/x1","SVC/g1/x2","SVC/g1/x3"],"q":[],"p":[],"k":[]},"SVC/g2/x0":{"title":"입퇴실·공실 현장확인 — 건수 무제한","note":"제안서: 중개지원이므로 추가방문비 없음. 내용: 퇴실일·열쇠·계량기·상태사진·광고정보·신규 인수안내.\n→ 가장 큰 무료업무. 건당 몇 시간인지부터 세야 한다.","children":[],"q":[],"p":[],"k":[]},"SVC/g2/x1":{"title":"작업 미흡 재확인","note":"무상. 빈도가 곧 품질 지표. QA-01 연결.","children":[],"q":[],"p":[],"k":[]},"SVC/g2/x2":{"title":"회수 구조가 성립하는가","note":"중개보수→협업 중개법인(브링 몫 아님). 브링 회수처→입주청소·공간기획·전문작업 5%.\n즉 무료 현장확인은 '청소·기획 수주 전환율'로만 회수된다. 전환율 낮으면 구조적 적자.\n대표 확인 필요: 최근 퇴실 건 중 입주청소 수주 비율.","children":[],"q":[],"p":[],"k":[]},"SVC/g2":{"title":"","note":"GOV-01이 '무료업무도 기록하고 원가를 측정한다'고 정했다. 이 목록이 SVC '무료업무 원가' 지표의 측정 대상.","children":["SVC/g2/x0","SVC/g2/x1","SVC/g2/x2"],"q":["입퇴실 현장확인 1건에 몇 시간(이동 포함)?","그 건들 중 청소·기획 수주로 이어진 비율은?","안 이어진 건은 왜? 건물주가 직접 하나, 다른 업체를 쓰나?"],"p":["무료라서 세지 않는다 - 세지 않으면 적자인지 모른다.","중개보수는 협업법인이 받는데 현장은 우리가 무료로 한다 - 전환율로 정당화 못하면 남는 게 없다."],"k":[]},"SVC/g3/x0":{"title":"범위① 호실 상품화","note":"노후·공실 호실 → 도배·장판·조명·수납·촬영·임대료 전략","children":[],"q":[],"p":[],"k":[]},"SVC/g3/x1":{"title":"범위② 공용부 개선","note":"현관·복도·계단·조명·사인 → 첫인상·안전·청결·이미지","children":[],"q":[],"p":[],"k":[]},"SVC/g3/x2":{"title":"범위③ 건물 전체 재기획","note":"외관·공용부·호실·브랜드 → 콘셉트·투자순서·임대운영","children":[],"q":[],"p":[],"k":[]},"SVC/g3/x3":{"title":"업무 절차 9단계","note":"1 진단 2 목표임차인·임대료·공실기간 설정 3 필수/선택 개선 구분 4 콘셉트·자재·조명 5 공종별 견적비교 6 건물주 승인 후 직접계약 7 일정·출입·진행관리 8 완료사진·하자·보고 9 청소·촬영·광고·계약 연결","children":[],"q":[],"p":[],"k":[]},"SVC/g3/x4":{"title":"돈의 흐름","note":"진단·기획비→브링 / 공사관리→브링 / 공사비→등록업체 / 자재→업체 / 중개보수→협업법인. 공사대금 대신 수령 안 함.","children":[],"q":[],"p":[],"k":[]},"SVC/g3/x5":{"title":"면책","note":"예상 임대료·회수기간은 목표치이며 실제 성과를 보장하지 않는다.","children":[],"q":[],"p":[],"k":[]},"SVC/g3":{"title":"건물 공간기획 — 고부가가치 라인","note":"제안서가 '고부가가치'로 규정. 도구 6종과 달리 유일하게 가격·절차가 확정된 라인.\n정의: 예쁘게가 아니라 목표 임차인·적정 임대료를 정하고 필요한 공사만 선별해 공실기간·임대수익을 개선.\n출처: BRING 서비스제안서 (2026.08, 우산동)","children":["SVC/g3/x0","SVC/g3/x1","SVC/g3/x2","SVC/g3/x3","SVC/g3/x4","SVC/g3/x5"],"q":["공간기획을 실제 수행한 건이 몇 건? 기획비를 받은 건은?","목표 임대료 근거가 권역별 시세밴드(MKT)와 연결돼 있나?","절차2가 틀렸을 때 누가 책임지나? 면책 문구로 충분한가?"],"p":["목표 임대료를 근거 없이 정한다 - 시세밴드 없으면 희망이다.","공사관리 수수료가 공사비의 %라 크게 할수록 우리 수익 - 이해충돌. '필수/선택 구분' 기준이 문서화 안 됨.","9단계 마지막(계약연결)이 협업법인 몫이라 통제 밖 - 여기서 끊기면 성과 증명 안 됨."],"k":[{"n":"공간기획 수행 건수","goal":"측정 시작","cur":""},{"n":"기획 후 공실기간 단축일","goal":"건별 기록","cur":""},{"n":"기획 후 임대료 변화","goal":"목표 대비 실제","cur":""}]},"MKT/g0/i0":{"title":"상지대(우산동) — 대학생","note":"확정: 제안서 서비스 기준이 '우산동 집중관리권역'. 상지대가 우산동.\n피크 3월·9월 → 착수 1월·7월. 학기 단위 짧은 계약, 방학 공실, 부모 개입.\n가격 민감도 높음(총거주비·겨울 난방비).\n권역 설계 의도: 월 2회 방문을 권역 지정일에 묶어 이동시간 절감 → 61,000원 할인이 성립. 밀도=수익성.\n대표 확인 필요: 우산동 권역 내 건물 수·호실 수.","children":[],"q":[],"p":[],"k":[]},"MKT/g0/i1":{"title":"단계동 — 직장인 (건물 1개, 예외)","note":"재무대장 기준 단계동은 건물 1개(햇빛빌라)뿐. 정식 권역이 아니라 예외 건물로 보는 게 맞다.\n제안서: '관리권역 밖 방문은 별도 협의' → 이 1동 이동시간 처리를 정해야 한다. 안 그러면 이동이 무료업무가 된다.\n수요 특성: 인사이동·전입, 연중 분산. 계약 길고 갱신율 높으나 한 번 비면 오래. 총액보다 출퇴근·주차·보안.\n대표 확인 필요: 단계동 주 수요 직장(혁신도시/의료기기클러스터/시내).","children":[],"q":[],"p":[],"k":[]},"MKT/g0/i2":{"title":"권역별 시세표 분리","note":"두 권역을 한 시세표로 보면 둘 다 틀린다. 피크·계약기간·반응 조건이 다르다. 비교군은 같은 권역 안에서만. MKT-02의 '같은 생활권'이 이 뜻.","children":[],"q":[],"p":[],"k":[]},"MKT/g1/x0":{"title":"수요 신호","note":"대학 학기 캘린더(상지대 3·9월)·기업전입(단계동)·1인가구 추이·계절 변수.","children":[],"q":[],"p":[],"k":[]},"MKT/g1/x1":{"title":"공급 신호","note":"세움터 신축 인허가(반경 500m)·주변 공실 체감·경쟁 매물 재고.","children":[],"q":[],"p":[],"k":[]},"MKT/g1/x2":{"title":"가격 신호 — 총거주비","note":"실거래가(국토부)+총거주비(월세+관리비+공과금+주차)+옵션 환산+시세밴드. 지금 바로 쓸 수 있는 건물주 설득 근거.","children":[],"q":[],"p":[],"k":[]},"MKT/g1/x3":{"title":"정책 신호","note":"임대차보호법·보증보험·전세사기 대책·원주시 조례.","children":[],"q":[],"p":[],"k":[]},"MKT/g1/x4":{"title":"수집 리듬 — 월 1회","note":"시세 월 1회. 1·7월 집중. 담당=대표(위임 조건 3가지 충족 시 중개담당 이관).","children":[],"q":[],"p":[],"k":[]},"MKT/g1":{"title":"","note":"MKT-02가 요구하는 입력을 만들어내는 체계. 앞 두 신호를 여기서, 뒤 두 개(문의·이탈)는 CRM 퍼널에서.","children":["MKT/g1/x0","MKT/g1/x1","MKT/g1/x2","MKT/g1/x3","MKT/g1/x4"],"q":["권역별 피크 2개월 전에 준비를 시작하나?","우리 총거주비는 같은 권역 비교군 중 몇 번째?","반경 500m 신축 준공이 3개월간 몇 개?"],"p":["시세를 감으로 정한다 - 건물주 희망가에 끌려간다.","월세만 비교하고 관리비·공과금·옵션을 뺀다 - MKT-02 금지.","조회수 낮다고 가격부터 내린다 - MKT-02 금지."],"k":[{"n":"권역별 비교군 매물수","goal":"10건 이상","cur":""},{"n":"시세 갱신 주기","goal":"월 1회","cur":""}]},"MKT/g2/x0":{"title":"경쟁 유형 4종","note":"① 건물주 직접 관리(가장 큰 경쟁, 비용0) ② 지역 중개사무소 부수관리 ③ 전국 관리업체 ④ 플랫폼 매물관리","children":[],"q":[],"p":[],"k":[]},"MKT/g2/x1":{"title":"비교 축","note":"서비스 범위 / 책임경계·증빙 / SLA(응답·완료 분리) / 수수료 구조 / 사고 처리. 가격 아닌 책임경계로 비교.","children":[],"q":[],"p":[],"k":[]},"MKT/g2/x2":{"title":"차별점 검증","note":"증빙 공개(동일각도 사진·전후검수) / 판단 분리 / 고객 언어 3문장. 문서에만 있으면 차별점이 아니다.","children":[],"q":[],"p":[],"k":[]},"MKT/g2/x3":{"title":"수집 — ONB-01 상담","note":"'지금 누구에게 맡기고 무엇이 불만인가'를 상담 정식 항목으로. 거절·이탈 사유 한 줄 기록. VEN-01로 업체 정보.","children":[],"q":[],"p":[],"k":[]},"MKT/g2":{"title":"","note":"책 11번을 브링 상황으로. 16번이 '가격'을 만든다면 여기는 '왜 우리를 골라야 하는가'.","children":["MKT/g2/x0","MKT/g2/x1","MKT/g2/x2","MKT/g2/x3","MKT/g2/x4"],"q":["최근 수주 5건에서 고른/안 고른 이유를 말할 수 있나?","'비싸다'에 할인 말고 무엇으로 답하나?","경쟁사가 안 하는 것 중 우리가 하는 것 3개를 돈으로 설명 가능한가?"],"p":["가격으로만 비교 → 할인으로 답한다.","이탈 사유 미기록 → 같은 이유로 계속 잃는다.","가장 큰 경쟁이 '건물주 직접 관리'인 걸 잊는다."],"k":[]},"MKT/g3/x0":{"title":"① 공실 — 시계를 켭니다","note":"\"공실은 퇴실 통보받은 날부터 시계를 켭니다. 며칠 걸렸고 어디서 막혔는지 숫자로 보고드립니다.\"\n근거: 공실 시계 + MKT-02 퍼널.","children":[],"q":[],"p":[],"k":[]},"MKT/g3/x1":{"title":"② 비용 — 승인 없이 나가는 돈은 없습니다","note":"\"수리는 사진 먼저, 견적 비교, 승인 후 시공. 승인 없이 나가는 돈은 없습니다.\"\n근거: VEN-02 + 완료의 정의. 건물주 1순위 불신(업체와 짜고 부풀림)에 절차로 답.","children":[],"q":[],"p":[],"k":[]},"MKT/g3/x2":{"title":"③ 책임 — '다 해드립니다'라고 말하지 않습니다","note":"\"하는 일과 하지 않는 일을 계약서에 먼저 적습니다.\"\n근거: GOV-01 무제한표현 금지. 역발상이 신뢰를 만든다.","children":[],"q":[],"p":[],"k":[]},"MKT/g3/x3":{"title":"④ 분쟁용 — 사실과 책임을 나눠 정리","note":"\"관찰한 사실·원인·책임·비용을 나눠 정리해 드립니다. 감정으로 판정하지 않습니다.\"\n근거: 판단 분리. 분쟁 경험 건물주에게만.","children":[],"q":[],"p":[],"k":[]},"MKT/g3/x4":{"title":"'비싸다' 대응 3단계","note":"1 숫자: 공실 한 달이 수수료 몇 달분? 2 범위조정: 수수료 낮추려면 업무 범위를 줄인다(GOV-01 구분) 3 무료업무 원가: 무료도 원가가 있어 계속 두면 다른 곳이 부실해진다.\n금지: 할인으로 따면 처음부터 적자.","children":[],"q":[],"p":[],"k":[]},"MKT/g3":{"title":"","note":"상담 3문장 초안. 매뉴얼 원칙에서 뽑음. 평시 ①②③, 분쟁 경험 건물주엔 ④ 추가.\n사용 규칙: 지킬 수 있는 문장만. ②를 말했으면 VEN-02를 반드시 지킨다.","children":["MKT/g3/x0","MKT/g3/x1","MKT/g3/x2","MKT/g3/x3","MKT/g3/x4"],"q":[],"p":[],"k":[]},"FIN/g0/x0":{"title":"현재 6동 — 월 약 -250만","note":"10동이 -2,483,786원이므로 6동은 그보다 나쁘다. 단, 대표 인건비 포함 여부 확인 필요. 급여 미수령이면 현금흐름은 덜 나쁘다. → '적자지만 버티는' 재원이 대표 인건비.","children":[],"q":[],"p":[],"k":[]},"FIN/g0/x1":{"title":"손익분기 ≈ 35~40동","note":"30동 -685,357 / 50동 +1,113,071. 현재 6동 → BEP까지 약 30동. 이것이 지금 유일한 숫자 목표.","children":[],"q":[],"p":[],"k":[]},"FIN/g0/x2":{"title":"70동 함정 — 다시 적자","note":"50동 +111만 → 52동 +124만 → 70동 -13.8만 → 80동 +76만 → 100동 +256만.\n원인: 1인 55동 가정. 56동부터 2인 필요→인건비 300만 계단. 관리비 50동 362만→70동 675만.\n56~75동은 계획적으로 통과해야 하는 적자 구간.","children":[],"q":[],"p":[],"k":[]},"FIN/g0/x3":{"title":"100동 — 월 +256만(17.8%)","note":"총매출 14,381,810 / 총비용 11,822,668 / 영업이익 2,559,142. 연 3,070만. 동당 이익 25,591원(얇다).","children":[],"q":[],"p":[],"k":[]},"FIN/g0/x4":{"title":"이익의 44%는 결합서비스","note":"100동 매출: 관리 800만 + 공용부 420만 + 입퇴실 218만. 관리 단독은 56%뿐. 결합률·입퇴실 건수 무너지면 이익 구조 붕괴.","children":[],"q":[],"p":[],"k":[]},"FIN/g0":{"title":"","note":"보수적 시뮬레이션. 공용부 결합률 70%, 입퇴실 0.3건/동·월, 1인 55동 가정.\n출처: 브링케어_사업운영_재무관리대장_v1.xlsx","children":["FIN/g0/x0","FIN/g0/x1","FIN/g0/x2","FIN/g0/x3","FIN/g0/x4"],"q":["6동에서 매달 빠지는 현금이 얼마? 대표 급여 0 기준인가?","BEP 35~40동까지 월 몇 동씩 늘려 몇 개월에?","56동 넘을 때 2인 채용? 아니면 55동 가정을 먼저 실측?"],"p":["규모를 키우면 나아진다고 믿는다 - 56~75동은 나빠진다.","관리비 89,000만 보고 판단 - 이익의 44%가 결합서비스.","대표 인건비를 빼고 적자를 흑자로 착각."],"k":[{"n":"현재 등록 건물","goal":"BEP 35~40동","cur":"6"},{"n":"월 실제 현금 적자","goal":"측정 필요","cur":""},{"n":"동당 영업이익","goal":"100동시 25,591원","cur":""}]},"FIN/g1/x0":{"title":"1인 55동 — 최대 위험","note":"'실제 검증 필요'라고 대장에 적힘. 40동이면 BEP 뒤로, 70동이면 함정 소멸. 모델에서 가장 민감한 단일 가정. 최우선 실측.","children":[],"q":[],"p":[],"k":[]},"FIN/g1/x1":{"title":"업무시간 90분 — 8주 측정","note":"35분 점검/90분 총시간(가정). 준비자료 시트가 '8주 측정' 최우선 지정. 55동 용량의 근거. PM-01 순회 중 타임로그.","children":[],"q":[],"p":[],"k":[]},"FIN/g1/x2":{"title":"실수령 80,000원 (견적 89,000)","note":"차액 9,000은 공동구매·할인. 6동 실제 계약가가 80,000 밑돌면 모델이 낙관적. 대표 확인 필요.","children":[],"q":[],"p":[],"k":[]},"FIN/g1/x3":{"title":"공용부 결합률 70% — 목표","note":"달성 아님. 100동 이익의 상당부분. 현재 6동 중 계단청소 결합 건물이 몇 개?","children":[],"q":[],"p":[],"k":[]},"FIN/g1/x4":{"title":"입퇴실 0.3건/동·월 — 보수적","note":"목표 0.5. 단 '우리가 청소 수주한 건수'여야지 퇴실 발생 건수가 아니다. = 무료업무 전환율.","children":[],"q":[],"p":[],"k":[]},"FIN/g1/x5":{"title":"공용부 변동원가 44,333원","note":"판매가 60,000 대비 마진 26%. 기준안 50,000이면 11%로 하락. 층수별 시간 측정 필요.","children":[],"q":[],"p":[],"k":[]},"FIN/g1":{"title":"","note":"모델의 결론이 이 가정들에 달렸다. '가정' 표시가 틀리면 BEP가 움직인다.\n출처: 브링케어_사업운영_재무관리대장_v1.xlsx","children":["FIN/g1/x0","FIN/g1/x1","FIN/g1/x2","FIN/g1/x3","FIN/g1/x4","FIN/g1/x5"],"q":["1인 55동 확인에 무엇을 몇 주 재나(대장 8주)?","6동 실제 계약가 평균이 80,000 이상?","현재 공용부 결합 건물이 6동 중 몇 개?"],"p":["가정을 확정으로 취급 - 대장은 가정/목표/확정을 구분했는데 읽는 사람이 뭉갠다.","가장 민감한 가정(1인55동)을 검증 없이 채용·확장 결정."],"k":[]},"FIN/g2/x0":{"title":"① 원주 유료 건물","note":"최소 80/목표 100. 현재 6. 실제 입력 필요.","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x1":{"title":"② 연환산 매출","note":"최소 1.7억/목표 2억. 100동 시뮬레이션(실적 아님).","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x2":{"title":"③ 영업이익률","note":"최소 15/목표 18%. 100동시 17.8%. 6개월 유지. 시뮬레이션.","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x3":{"title":"④ 실적 검증기간","note":"최소 6/목표 12개월. 실제 입력 필요. 언제부터 세는지 정해야.","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x4":{"title":"⑤ 대표 없이 운영 80~90%","note":"실제 입력 필요. CORE '대표 단독결정'과 같은 문제. 시장조사를 대표가 직접 하기로 한 것과 충돌. 측정안: CRM 티켓 중 대표 개입 없이 종결된 비율.","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x5":{"title":"⑥ 춘천 사전계약","note":"최소 10/목표 20동. 투자 실행조건.","children":[],"q":[],"p":[],"k":[]},"FIN/g2/x6":{"title":"⑦ 월 해지율","note":"2%↓/목표 1%. 6동에선 1동 해지가 16.7% - 소규모는 절대 건수로 관리.","children":[],"q":[],"p":[],"k":[]},"FIN/g2":{"title":"","note":"투자금 1억/기업가치 9억(하한 6억)/지분 10% 목표. 아래 7개가 통과조건, 5개가 '실제 입력 필요' 상태.\n출처: 브링케어_사업운영_재무관리대장_v1.xlsx","children":["FIN/g2/x0","FIN/g2/x1","FIN/g2/x2","FIN/g2/x3","FIN/g2/x4","FIN/g2/x5","FIN/g2/x6"],"q":["7개 중 지금 숫자로 답 가능한 게 하나라도?","⑤ 대표 없이 80%를 어떻게 측정? 정의 없으면 영원히 미입력.","실적 검증 6개월은 언제부터? 그 시작일이 투자 일정의 실질 출발점."],"p":["7개 중 5개가 '실제 입력 필요' - 모델은 정교한데 실적이 빈다.","투자조건에 '대표 없이 운영'이 있는데 실무는 대표에게 몰린다."],"k":[]},"FIN/g3/x0":{"title":"우산동 5동","note":"북원로 2507번길 71-1 / 비전하우스 / 우무개로 88 / 우산오피스텔 / 해피하우스. 모두 '체크리스트 보유'. 집중관리권역이라 동선이 묶인다.","children":[],"q":[],"p":[],"k":[]},"FIN/g3/x1":{"title":"단계동 1동 (햇빛빌라)","note":"권역 밖 예외 건물. 이동시간 처리 확인 필요.","children":[],"q":[],"p":[],"k":[]},"FIN/g3/x2":{"title":"채워야 할 칸 6개","note":"층수/세대수/관리월가격/계단청소가격/월입퇴실건수/월업무시간(분)+계약시작일.\n채우면 자동으로 나오는 것: 실수령 80,000 검증, 공용부 결합률, 입퇴실 실제건수, 1인55동 근거, 실적검증 시작일.","children":[],"q":[],"p":[],"k":[]},"FIN/g3/x3":{"title":"8주 타임로그","note":"준비자료 시트 최우선. PM-01 순회 때 이동 출발·도착·작업 종료 시각 기록. 기존 SOP에 칸 하나 더하는 일.","children":[],"q":[],"p":[],"k":[]},"FIN/g3":{"title":"","note":"재무대장 03_6개건물. 건물명·지역만 있고 관리가격·세대수·업무시간·계약시작일·매출이 전부 공란. 6건 모두 '확인필요'.\n이 표를 채우는 것이 v1.0 승인과 투자조건의 공통 출발점.\n출처: 브링케어_사업운영_재무관리대장_v1.xlsx","children":["FIN/g3/x0","FIN/g3/x1","FIN/g3/x2","FIN/g3/x3"],"q":["계약서·통장만 보면 채울 칸이 몇 개?(대부분)","8주 타임로그를 오늘 시작하면 언제 1인55동을 검증?"],"p":["모델은 정교한데 실적표가 빈다 - 모든 진단이 여기로 모인다.","6동뿐인데 6동 실제 원가를 모른다 - 100동 계획보다 먼저다."],"k":[{"n":"실적 입력 완료 건물","goal":"6/6","cur":"0/6"},{"n":"타임로그 측정 주차","goal":"8주","cur":"0"}]},"GROW/g0/i0":{"title":"현장 30~100건 적용","note":"매뉴얼 v0.9→v1.0 승인 조건. 오늘까지 누적 건수를 세는 곳이 필요. CRM 티켓과 연동.","children":[],"q":[],"p":[],"k":[]},"GROW/g0/i1":{"title":"전문가 서면검토","note":"중개·관리·안전·법무·세무 서면검토 후 v1.0. 변경이력·교육 반영.","children":[],"q":[],"p":[],"k":[]},"GROW/g1/i0":{"title":"DATA-01 데이터 모델","note":"매뉴얼에 이미 정의: '건물-호실-계약-사람-티켓-비용-업체의 ID를 연결한다.' CRM 스키마 기준. 새로 고민할 필요 없다.","children":[],"q":[],"p":[],"k":[]},"GROW/g1/i1":{"title":"BRING-CRM 1.7.0 (소스 보유)","note":"outputs/BRING-CRM-1.7.0-final-20260814. 설치본만 있는 게 아니라 소스가 있다.\n대표 확인 필요: 데이터 내보내기(CSV/DB) 경로.","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x0":{"title":"5동 POC","note":"외주·현지 파트너. 시장검증.","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x1":{"title":"10동 사전진입","note":"사전계약 확보 = 투자 실행조건. 없으면 투자 자체가 성립 안 함.","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x2":{"title":"20동 초기운영","note":"시간제 현지운영. 동선 검증.","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x3":{"title":"35동 손익분기","note":"전담인력 준비. 현지원가 재검증(원주 원가 그대로 옮기면 틀림).","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x4":{"title":"50동 안정거점","note":"현지 1인 운영. 영업이익률 안정화.","children":[],"q":[],"p":[],"k":[]},"GROW/g2/x5":{"title":"투자금 1억 사용","note":"춘천 인건비 3,000 / 영업·고객 2,000 / 시스템 1,500 / 차량·장비·보증금 1,000 / 법인·회계·보험 1,000 / 예비비 1,500(만원).","children":[],"q":[],"p":[],"k":[]},"GROW/g2":{"title":"","note":"투자금 1억의 주 사용처가 춘천(현지 인력 3,000만).\n출처: 브링케어_사업운영_재무관리대장_v1.xlsx","children":["GROW/g2/x0","GROW/g2/x1","GROW/g2/x2","GROW/g2/x3","GROW/g2/x4","GROW/g2/x5"],"q":["원주 BEP 전에 춘천 10동 사전계약이 가능한가?","춘천 POC 5동을 언제 시작? 투자(2027 하반기) 전에 끝나야 조건."],"p":["원주 검증 전 춘천 - v1.0 미승인 확장은 문제 복제.","춘천 BEP 35동은 '현지원가 확인 필요' - 원주 원가 그대로 옮기면 틀린다."],"k":[]},"FIN/g1/x6":{"title":"★ 월 2회 확정 → 순회는 병목 아님, 재계산은 남은 90%","note":"확정 사실 두 가지: 월 점검 2회 / 건물당 순회 10분.\n\n순회 재계산 (좋은 소식)\n  55동 × 월2회 × 10분 = 1,100분/월 = 18.3시간 (1인 근로 176시간의 10%).\n  순회만으로는 1인이 500동 넘게 가능하다. 순회는 55동 용량의 제약이 아니다.\n  → 지난 판단 정정: '월2회면 시간이 2배'는 순회에 한해선 과장이었다. 순회 증가분은 동당 +10분/월로 미미하다.\n\n그럼 55동은 무엇이 정하나 (측정 대상)\n  근로의 나머지 90%(9,460분) = 이동 + 사진·보고 작성 + 세입자 문의응대 + 입퇴실 현장확인(무료업무) + 청소 감독.\n  이 중 가장 큰 변수는 입퇴실 현장확인이다(건당 시간이 크고 무료).\n  → 8주 타임로그는 '순회 시간'이 아니라 '이동·보고·문의·입퇴실 시간'을 재야 한다. 순회는 이미 답이 나왔다.\n\n변동비 (월2회 영향)\n  이동·소모품이 방문 2배로 늘지만, 권역 밀집 순회(정해진 곳을 도는 방식)면 건물 간 이동이 짧아 증가분이 작다.\n  → 앞서 계산한 영업이익률 13~15%는 '변동비 2배'를 가정한 보수적 하한. 실제는 그보다 나을 수 있다.\n\n종합: 순회가 짧다는 건 55동 용량이 오히려 보수적일 수 있다는 뜻(대장은 순회를 35분으로 가정). BEP가 예상보다 나을 여지가 있다. 단, 남은 90% 업무시간을 재기 전엔 단정 못 한다.","children":[],"q":[],"p":[],"k":[]},"MKT/g2/x4":{"title":"정기 점검의 가치 — 건물주가 매번 안 가봐도 됨","note":"대표 확인: 정해진 곳을 정기적으로 봐주고, 문제 유무를 확인하고, 사진으로 보고한다. 이 자체가 가치다.\n\n가치의 정체(건물주 관점): 내가 매번 현장에 안 가도 된다 = 시간 + 안심. 제안서의 '건물주가 체감하는 가장 큰 가치'와 정확히 일치한다.\n\n이것이 두 곳의 근거가 된다:\n  ① 89,000원의 정당성 — 순회 10분의 원가가 아니라 '대신 봐주는 안심'의 값이다. 원가 기반이 아니라 가치 기반 가격.\n  ② 경쟁 비교 — '건물주 직접 관리'(비용 0)와 싸울 때의 답. 직접 관리의 숨은 비용은 매번 가보는 시간과 놓치는 문제다.\n\n단, 가치 주장은 증빙으로 뒷받침돼야 한다: 사진 보고·문제 발견 기록이 쌓여야 '봐주고 있다'가 증명된다. QA-01·완료의 정의와 연결.","children":[],"q":[],"p":[],"k":[]},"SVC/g3/i0":{"title":"월 점검 = 월 2회 (확정) · 순회 10분","note":"확정: 월 2회(약 2주 간격), 건물당 순회 10분. 제안서가 맞고 재무대장 04(월 1회)가 틀렸다.\n\n원가 영향:\n  · 순회 시간 자체는 작다(동당 월 20분). 병목이 아니다. → FIN 재계산 참조.\n  · 변동비(이동·소모품)는 방문 2배로 늘지만 권역 밀집이면 증가분이 작다.\n  · 89,000원이 월 2회 원가를 감당하는지는 '순회'가 아니라 '입퇴실 현장확인·문의·보고' 시간에 달렸다.\n\n→ 8주 타임로그로 남은 업무시간을 재면 확정된다.","children":[],"q":[],"p":[],"k":[]},"SVC/g3/i1":{"title":"공용부 층수별 단가","note":"제안서: 60,000원부터. 재무대장 기준안: 3층 50,000/4층 60,000/5층 70,000/8층 80,000.\n→ 3층에 50,000 받으면 대외 '60,000부터'와 어긋난다. 대외문구·내부기준안 일치 필요.","children":[],"q":[],"p":[],"k":[]},"SVC/g3/i2":{"title":"평수 실측 기준","note":"평수별 정찰제는 '평수'가 확정돼야 성립. 실측 기준·오염도 추가금 규정 필요.","children":[],"q":[],"p":[],"k":[]},"CORE/g4/i0":{"title":"① 시장·공실 분석","note":"고객 건물주 · 수익 진단비·기획비","children":[],"q":[],"p":[],"k":[]},"CORE/g4/i1":{"title":"② 지역 공동관리","note":"고객 건물주 · 수익 월 관리비 (건물관리 89,000)","children":[],"q":[],"p":[],"k":[]},"CORE/g4/i2":{"title":"③ 공실 해결","note":"고객 건물주 · 수익 공실관리·광고기획비","children":[],"q":[],"p":[],"k":[]},"CORE/g4/i3":{"title":"④ 입주자 생활서비스","note":"고객 임차인·제휴사 · 수익 이용료·제휴수익","children":[],"q":[],"p":[],"k":[]},"CORE/g4/i4":{"title":"⑤ 건물 가치상승","note":"고객 건물주 · 수익 기획·공사관리·성과보수","children":[],"q":[],"p":[],"k":[]},"CORE/g4":{"title":"","note":"BRING의 정의 확장: 원룸·다가구를 공동관리하고 공실을 줄이며, 생활서비스와 지역데이터로 임대수익 안정성과 건물가치를 높이는 지역형 주거 운영회사.\n수익은 5개 층에서 나온다. 지금 브링케어는 ②③에 있고, ①④⑤로 넓히는 것이 이 기획의 방향.\n출처: 통합 마스터 기획 (더휴식 기획-운영-데이터-가치상승 구조를 원룸시장에 적용)","children":["CORE/g4/i0","CORE/g4/i1","CORE/g4/i2","CORE/g4/i3","CORE/g4/i4"],"q":[],"p":[],"k":[]},"MKT/g4/i0":{"title":"영업 입구: 관리 말고 '공실 진단'","note":"기존: '공동관리를 맡겨주세요' → 변경: '공실이 왜 안 나가는지 분석하고 광고·가격·상품·중개채널을 다시 설계해 드립니다.'\n이유: 건물주는 공실로 실제 손실 중이라 관리서비스보다 공실해결에 더 빠르게 반응한다.\n→ 이게 관리계약(89,000)의 앞단 미끼이자 신뢰 형성 단계.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i1":{"title":"1 무료 기초진단 (10항목)","note":"공실기간·현재가격·경쟁가격·광고사진·광고문구·플랫폼·옵션·관리비·시설상태·중개업소 반응.\n무료지만 SVC 무료업무처럼 원가가 있다 — 진단이 계약으로 전환되는 비율을 세야 한다.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i2":{"title":"2 공실 원인분류 (10유형)","note":"가격·사진·설명·시설·관리·위치·타깃·중개망·계절·공급과잉. MKT-02가 금지한 '조회수 낮다고 가격부터'를 막는 진단 틀.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i3":{"title":"3 개선안","note":"가격·보증금 조정 / 관리비 명확화 / 사진 재촬영 / 타깃 변경 / 옵션 가감 / 공용부 청소 / 소규모 수리 / 입주혜택 / 중개사 재배포.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i4":{"title":"4 30일 운영","note":"3일 노출 확인 → 7일 문의 → 14일 방문 → 21일 조건 재검토 → 30일 전면 재기획 또는 중단.\nMKT-02의 7/14/30일 퍼널 진단과 동일 리듬.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i5":{"title":"5 성과보고 → 6 관리계약 전환","note":"성과: 광고 전후 조회·문의·방문·계약·소요기간·비용·개선요인·예방책.\n전환 멘트: '공실은 광고만의 문제가 아니라 평소 청소·시설·민원·입퇴실이 누적된 결과. 앞으로 공실 발생 전부터 관리하겠습니다.'","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i6":{"title":"광고 플랫폼 전략","note":"핵심: 네이버부동산·당근·직방·다방·피터팬·지역중개. 보조: 블로그·플레이스·인스타·대학커뮤니티·기업/병원 게시판·외국인 커뮤니티.\nA/B: 대표사진·제목·가격·보증금·관리비·옵션·입주혜택·BRING 관리표시·타깃·설명순서.\n플랫폼별로 노출·문의·방문·계약·광고비·계약소요일을 기록해 채널 효율을 본다.","children":[],"q":[],"p":[],"k":[]},"MKT/g4/i7":{"title":"중개사 공동배포 (법적 주의)","note":"여러 중개사를 움직이되 매물정보는 통제(동일가격·허위금지·승인사진·관리비 세부·가계약 즉시공유·계약시 광고종료).\n\n★ 법적 주의: BRING이 등록 중개사무소가 아니라 관리회사/중개보조원 지위라면 중개보수 배분에 직접 참여하는 구조는 피해야 한다.\n권장 구조:\n  · BRING → 공실진단·사진·매물자료·관리서비스 (건물주에게 공실관리·마케팅비 수취)\n  · 제휴 개업공인중개사 → 광고·현장안내·계약 (거래당사자에게 중개보수 수취)\n향후 적법 중개사무소 운영 시 개공 간 공동중개계약으로 역할·배분을 문서화.","children":[],"q":[],"p":[],"k":[]},"MKT/g4":{"title":"","note":"공실해결을 영업 입구로 삼는 모델. 관리계약을 바로 파는 대신, 손실 중인 공실을 먼저 해결해 신뢰를 만들고 관리계약으로 전환한다.\n출처: 통합 마스터 기획 10~12장.","children":["MKT/g4/i0","MKT/g4/i1","MKT/g4/i2","MKT/g4/i3","MKT/g4/i4","MKT/g4/i5","MKT/g4/i6","MKT/g4/i7"],"q":["최근 공실 진단을 제안한 건물주 중 관리계약으로 전환된 비율은?","무료 기초진단 1건에 몇 시간 드나? SVC 무료업무처럼 원가가 있다.","중개보수 배분에 직접 참여하고 있진 않나? (등록 중개사무소 아니면 법적 위험)"],"p":["무료 진단이 계약으로 전환되지 않으면 이것도 구조적 적자 — SVC 무료 현장확인과 같은 함정.","중개보수 배분 직접 참여는 공인중개사법 위반 소지 — 지위 확인 전엔 '자료·관리' 대가만 받는다.","30일 운영에서 '중단' 결정을 안 내리면 안 나가는 공실에 계속 매달린다."],"k":[]},"SVC/g4/i0":{"title":"1순위 입주·퇴실","note":"입주청소·퇴실청소·이사·폐기물·원상복구·인터넷·가구가전. 이미 서비스 5종의 입퇴실청소와 연결.","children":[],"q":[],"p":[],"k":[]},"SVC/g4/i1":{"title":"2순위 생활수리","note":"전등·수전·배수·도어록·방충망·실리콘·소모품. 소액 반복 → 협력업체 또는 직접.","children":[],"q":[],"p":[],"k":[]},"SVC/g4/i2":{"title":"3순위 반복생활","note":"정기청소·세탁·방역·필터·공동구매. 제휴수익 가능.","children":[],"q":[],"p":[],"k":[]},"SVC/g4/i3":{"title":"4순위 주거이동 = 진짜 락인","note":"계약만료 알림 → 다른 BRING 관리건물 추천 → 이사·청소 결합 → 혜택 승계.\n★ 핵심 통찰: 진짜 락인은 한 건물에 붙잡아두는 게 아니라, 이사하더라도 BRING 관리건물 안에서 이동하게 만드는 것.\n→ 이게 재계약률만이 아니라 '임차인 생애가치'를 만든다.","children":[],"q":[],"p":[],"k":[]},"SVC/g4":{"title":"","note":"임차인·제휴사 대상 생활서비스. 4순위(주거이동)가 전략의 핵심 — 임차인을 건물이 아니라 BRING 네트워크에 묶는다.\n출처: 통합 마스터 기획 14장.","children":["SVC/g4/i0","SVC/g4/i1","SVC/g4/i2","SVC/g4/i3"],"q":["퇴실하는 임차인에게 다른 BRING 건물을 추천한 적이 있나?","생활서비스 이용률이 재거주기간·재계약률과 연결되는지 추적하나?"],"p":["생활서비스를 원가 없이 '서비스'로만 본다 — 청소·수리도 SVC 단가·원가가 있어야 한다.","락인을 '한 건물 붙잡기'로 오해한다 — BRING 건물이 적으면 이동시킬 곳이 없다. 건물 밀도가 선행조건."],"k":[]},"GROW/g3/i0":{"title":"원주 — 확장 준비 기준","note":"특정 생활권 30동 · 건물당 공헌이익 흑자 · 계약 유지율 90% · 소개계약 30% · 대표 없이 운영 80% · 지역변화/임대성과 데이터 축적.\n→ FIN BEP(35~40동)와 결이 같다. '30동+흑자'가 확장의 문지방.","children":[],"q":[],"p":[],"k":[]},"GROW/g3/i1":{"title":"춘천 파일럿 진입 기준","note":"원주 50~70동 · 6개월 연속 흑자 · 춘천 10~15동 사전계약 · 현지 업체망 · 9~12개월 운영자금.\n→ 기존 춘천 5단계(POC5→안정50)와 연결. 이 기준이 '투자 실행조건'.","children":[],"q":[],"p":[],"k":[]},"GROW/g3/i2":{"title":"강릉 — 별도 분석 필요","note":"춘천 모델 6~12개월 검증 후 진입. 강릉은 관광·계절수요 비중이 있어 원주·춘천 상품을 그대로 적용하지 말고 '평일 장기거주 수요'를 별도 분석.\n→ PDF 교훈: 관광 의존 수요보다 생활수요가 안정적.","children":[],"q":[],"p":[],"k":[]},"GROW/g3":{"title":"","note":"3도시 확장 순서와 각 진입 문지방. 원주 검증 없이 다음 도시로 가지 않는다.\n출처: 통합 마스터 기획 18장.","children":["GROW/g3/i0","GROW/g3/i1","GROW/g3/i2"],"q":[],"p":[],"k":[]},"VALUE/g0/i0":{"title":"앵커시설 효과 (성심당·대학·병원)","note":"강력한 앵커 하나가 주변 상권·임대수요를 바꾼다. BRING 앵커: 대학·대학병원·산단·공공기관·대형기업·복합몰·유명음식점·문화/체육/교통시설.","children":[],"q":[],"p":[],"k":[]},"VALUE/g0/i1":{"title":"운영형 vs 개발기대형 (유성 vs 선화동)","note":"가격 오를 지역 ≠ 지금 수익 잘 나는 지역. 운영형=현재수요 강·공실위험 낮음 / 개발기대형=미래기대·공실위험 높음. 전략과 위험이 다르다.","children":[],"q":[],"p":[],"k":[]},"VALUE/g0/i2":{"title":"현재 수익 우선 (용전동 교훈)","note":"개발 기대만 보고 매입하면 시행사 철수 시 위험. 현재 임대수익이 받쳐주면 개발 지연돼도 버틴다. → 미래개발은 추가상승 요인으로만, 현재 임대수익 성립 건물 우선.","children":[],"q":[],"p":[],"k":[]},"VALUE/g0/i3":{"title":"낡은 건물 ≠ 무가치 (광주 화정동)","note":"주변 수요·개발압력이 건물의 미래가치를 만든다. 노후 모텔촌도 교통·상업·산업이 강하면 토지가치가 오른다.","children":[],"q":[],"p":[],"k":[]},"VALUE/g0":{"title":"","note":"PDF(축하시설 부동산) 대전·광주 사례에서 뽑은 지역가치 원리. 수치가 아니라 인과 원리만 가져왔다.","children":["VALUE/g0/i0","VALUE/g0/i1","VALUE/g0/i2","VALUE/g0/i3"],"q":[],"p":[],"k":[]},"VALUE/g1/i0":{"title":"교통","note":"철도·지하철·버스·도로·역세권·터미널·환승·주차","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i1":{"title":"직장·산업","note":"기업이전·공장·산단·공공기관·병원증축·대형사업장·신규채용","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i2":{"title":"교육","note":"대학정원·학과이전·기숙사·유학생·캠퍼스확장 / 폐교·축소","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i3":{"title":"상업·생활","note":"대형마트·백화점·복합몰·유명상점·음식점밀집·체육·문화·공원","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i4":{"title":"주거공급","note":"원룸·오피스텔·아파트·기숙사 신축 / 노후철거·재개발·숙박전환","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i5":{"title":"정책·개발","note":"도시재생·역세권개발·용도변경·지구단위·정비사업·공공개발·인허가","children":[],"q":[],"p":[],"k":[]},"VALUE/g1/i6":{"title":"위험요인","note":"기업철수·대학정원감소·병원이전·상권쇠퇴·과잉공급·개발취소·금리·전세사고·안전","children":[],"q":[],"p":[],"k":[]},"VALUE/g1":{"title":"","note":"건물 수익·가치가 변한 원인을 이 7분류로 추적한다. '주변에 뭐가 생겨서/없어져서' 가치가 움직였는지 기록.","children":["VALUE/g1/i0","VALUE/g1/i1","VALUE/g1/i2","VALUE/g1/i3","VALUE/g1/i4","VALUE/g1/i5","VALUE/g1/i6"],"q":[],"p":[],"k":[]},"VALU const store = loadStore();
if (!store.nodes || typeof store.nodes !== "object") store.nodes = {};
if (typeof store.seq !== "number") store.seq = 0;

// SEED를 늘릴 때마다 이 번호를 올린다. 그래야 이미 쓰고 있는 브라우저에도 새 내용이 들어간다.
const SEED_VERSION = 4;

if (!Array.isArray(store.removed)) store.removed = [];

// 지운 항목은 되살리지 않는다 (삭제 기록)
const wasRemoved = nid => store.removed.some(r => nid === r || nid.startsWith(r + "/"));

if (store.seedVersion !== SEED_VERSION) {
  Object.entries(SEED).forEach(([nid, seedNode]) => {
    if (wasRemoved(nid)) return;
    const cur = store.nodes[nid];
    if (!cur) { store.nodes[nid] = seedNode; return; }
    // 직접 고친 내용이 우선. 새로 생긴 seed 자식만 덧붙인다.
    const seedKids = (seedNode.children || []).filter(c => !wasRemoved(c));
    const mine = (cur.children || []).filter(c => !seedKids.includes(c));
    store.nodes[nid] = { ...seedNode, ...cur, children: [...seedKids, ...mine] };
  });
  store.seedVersion = SEED_VERSION;
  delete store.seeded;
  saveStore(store);
}

// ============================================================
// 노드 — 기본 노드(AXES·BOOK에서 옴)와 사용자가 세운 하위 노드를 같은 주소체계로 다룬다
//   축:            "CARE"
//   트리 그룹:     "CARE/g0"
//   그룹 항목:     "CARE/g0/i2"
//   책 주제:       "BOOK/22"
//   사용자 추가:   "CARE/g0/i2/u7"   (u = user, 번호는 store.seq)
// ============================================================
function nodeOf(nid) {
  return store.nodes[nid] || {};
}

function mutateNode(nid, fn) {
  const cur = store.nodes[nid] || {};
  const next = fn({ children: [], q: [], p: [], k: [], note: "", ...cur });
  store.nodes[nid] = next;
  saveStore(store);
}

// 기본 노드의 제목을 원본 데이터에서 찾는다 (사용자 추가 노드는 store에 title 보유)
function baseTitle(nid) {
  const seg = nid.split("/");
  if (seg[0] === "BOOK") {
    const row = BOOK.find(b => String(b[0]) === seg[1]);
    return row ? `${row[0]}. ${row[1]}` : nid;
  }
  const axis = AXES.find(a => a.code === seg[0]);
  if (!axis) return nid;
  if (seg.length === 1) return `${axis.code} — ${axis.ko}`;
  const gi = Number(String(seg[1]).replace("g", ""));
  const group = axis.tree[gi];
  if (!group) return nid;
  if (seg.length === 2) return group.g;
  const ii = Number(String(seg[2]).replace("i", ""));
  const item = group.items[ii];
  if (item === undefined) return nid;
  return typeof item === "object" ? item.t : item;
}

function titleOf(nid) {
  const n = nodeOf(nid);
  if (n.title) return n.title;
  return nid.split("/").pop().startsWith("u") ? "(제목 없음)" : baseTitle(nid);
}

// 사용자 추가 노드인가 — 제목을 편집할 수 있는가
const isUserNode = nid => nid.split("/").pop().startsWith("u");

// 문서 근거로 이미 확인된 값은 미리 채워둔다 (사용자가 고치지 않은 칸만)
AXES.forEach(a => a.kpis.forEach((k, i) => {
  const key = `${a.code}:${i}`;
  if (k.pre && !(key in store)) store[key] = k.pre;
}));

// 노드 뱃지 — 하위에 세운 체계의 개수
function badgeHTML(nid) {
  const n = nodeOf(nid);
  const c = (n.children || []).length + (n.q || []).length + (n.p || []).length + (n.k || []).length;
  const badge = c ? `<span class="cc">${c}</span>`
    : (n.note || "").trim() ? `<span class="cc only-note" title="메모 있음">･</span>` : "";
  return badge + `<span class="enter">⤢</span>`;
}

function itemHTML(it, nid) {
  const empty = typeof it === "object" && it.empty;
  const text = typeof it === "object" ? it.t : it;
  return `<div class="${empty ? "empty" : ""}" data-nid="${nid}">${empty ? "○ " : ""}${esc(text)}${badgeHTML(nid)}</div>`;
}

function treeHTML(tree, axisCode) {
  return `<div class="tree">${tree.map((g, gi) => `
    <div class="tgroup">
      <div class="gh" data-nid="${axisCode}/g${gi}">${esc(g.g)}${badgeHTML(`${axisCode}/g${gi}`)}</div>
      <div class="items">${g.items.map((it, ii) => itemHTML(it, `${axisCode}/g${gi}/i${ii}`)).join("")}</div>
    </div>`).join("")}</div>`;
}

const SRC_LABEL = { crm: "CRM", doc: "문서", none: "없음" };

function kpiHTML(axisCode, kpis) {
  const rows = kpis.map((k, i) => {
    const key = `${axisCode}:${i}`;
    const val = store[key] || "";
    return `<tr>
      <td class="name">${esc(k.n)} <span class="tag ${k.src}">${SRC_LABEL[k.src]}</span>
        <em>목표 ${esc(k.goal)} · 근거 ${esc(k.where)}</em></td>
      <td><input data-key="${key}" class="${val ? "" : "blank"}" value="${esc(val)}" placeholder="현재값"></td>
    </tr>`;
  }).join("");
  return `<table class="kpi">
    <thead><tr><th>지표 · 목표 · 근거</th><th style="width:96px">현재값</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function covHTML(axisCode) {
  const rows = BOOK.filter(b => b[2] === axisCode);
  if (!rows.length) return "";
  const gapCount = rows.filter(b => b[3] === "none").length;
  const body = rows.map(([no, title, , st, note]) => `<tr data-st="${st}">
    <td class="no">${no}</td>
    <td class="ti" data-nid="BOOK/${no}">${esc(title)}${badgeHTML(`BOOK/${no}`)}<em>${esc(note)}</em></td>
    <td style="text-align:right"><span class="st ${st}">${ST_LABEL[st]}</span></td>
  </tr>`).join("");
  return `<div class="card"><div class="t"><span>책 체크리스트 ${rows.length}주제</span>
    <span class="tag" style="margin-left:auto">공백 ${gapCount}</span></div>
    <table class="cov"><tbody>${body}</tbody></table></div>`;
}

function axisHTML(a) {
  const blanks = a.kpis.filter((_, i) => !store[`${a.code}:${i}`]).length;
  const emptyNodes = a.tree.reduce((n, g) => n + g.items.filter(x => typeof x === "object" && x.empty).length, 0);
  return `<div class="axis" style="--ac-fg:${a.fg};--ac-bg:${a.bg};--ac-line:${a.line};--ac-node:${a.node}">
    <div class="axis-head" data-axis="${a.code}">
      <span class="code">${esc(a.code)}</span>
      <span class="ko">${esc(a.ko)}</span>
      <span class="badge ${emptyNodes ? "gap" : ""}" title="정의되지 않은 하위 항목">빈칸 ${emptyNodes}</span>
    </div>
    <div class="axis-panel"><div class="axis-body">
      <div class="col-tree">${treeHTML(a.tree, a.code)}</div>
      <div class="col-cards">
        <div class="card principle"><div class="t">💡 원칙 — 판단 기준</div><ul>${a.principle.map(p => `<li>${p}</li>`).join("")}</ul></div>
        <div class="card"><div class="t">? 점검 질문 — 지금 답할 수 있나</div><ul>${a.questions.map(q => `<li>${q}</li>`).join("")}</ul></div>
        <div class="card problem"><div class="t">⚠ 자주 나는 문제</div><ul>${a.problems.map(p => `<li>${p}</li>`).join("")}</ul></div>
        <div class="card"><div class="t"><span>지표</span><span class="tag" style="margin-left:auto">미기입 ${blanks}</span></div>${kpiHTML(a.code, a.kpis)}</div>
        ${covHTML(a.code)}
      </div>
    </div></div>
  </div>`;
}

const canvas = document.getElementById("canvas");

// 루트 노드 + 축들 + 배선
function canvasHTML() {
  const tally = BOOK.reduce((m, b) => ({ ...m, [b[3]]: (m[b[3]] || 0) + 1 }), {});
  const nodeCount = Object.keys(store.nodes).length;
  return `<svg id="wires"></svg>
    <div class="root">
      <h2>BRING CARE</h2>
      <div class="vis">건물관리·청소·공간기획 + 공실해결·가치상승 — 지역형 주거 운영<br>
        서비스를 판매하는 회사가 아니라 <b>운영의 기준을 만드는 회사</b></div>
      <div class="sum">
        <span>축 <b>${AXES.length}</b></span>
        <span>세워둔 체계 <b>${nodeCount}</b></span>
        <span>책 주제 <b>${BOOK.length}</b></span>
        <span>공백 <b>${tally.none || 0}</b></span>
      </div>
    </div>
    <div class="axes">${AXES.map(axisHTML).join("")}</div>`;
}

// 루트 하단에서 각 축 헤더 상단까지 직각으로 잇는다
function drawWires() {
  const svg = document.getElementById("wires");
  const root = canvas.querySelector(".root");
  const heads = [...canvas.querySelectorAll(".axis-head")];
  if (!svg || !root || !heads.length) return;

  const W = canvas.scrollWidth, H = canvas.scrollHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);

  // offsetTop은 offsetParent(.axes 등)마다 기준이 달라 어긋난다.
  // 화면 좌표로 재서 캔버스 기준으로 되돌리고, 적용된 확대율만 나눠준다.
  const k = view.k || 1;
  const cr = canvas.getBoundingClientRect();
  const box = el => {
    const r = el.getBoundingClientRect();
    return {
      x: (r.left - cr.left) / k, y: (r.top - cr.top) / k,
      w: r.width / k, h: r.height / k
    };
  };

  const rb = box(root);
  const rx = Math.round(rb.x + rb.w / 2);
  const ry = Math.round(rb.y + rb.h);
  const busY = ry + 34;

  const paths = heads.map(el => {
    const b = box(el);
    return `<path d="M${rx} ${busY} H${Math.round(b.x + b.w / 2)} V${Math.round(b.y)}"/>`;
  });
  svg.innerHTML = `<path d="M${rx} ${ry} V${busY}"/>` + paths.join("");
}

canvas.innerHTML = canvasHTML();

function countBlanks() {
  const total = AXES.reduce((n, a) => n + a.kpis.length, 0);
  const blank = AXES.reduce((n, a) => n + a.kpis.filter((_, i) => !store[`${a.code}:${i}`]).length, 0);
  document.getElementById("cnt").textContent = `${blank} / ${total}`;
}
countBlanks();

// 책 커버리지 요약
(() => {
  const tally = BOOK.reduce((m, b) => ({ ...m, [b[3]]: (m[b[3]] || 0) + 1 }), {});
  document.getElementById("cov").innerHTML =
    `책 49주제 — <span class="st have">있음 ${tally.have || 0}</span> ` +
    `<span class="st part">부분 ${tally.part || 0}</span> ` +
    `<span class="st none">없음 ${tally.none || 0}</span> ` +

// 공백만 보기 — 커버리지 '없음' 행과 미정의 노드만 남긴다
let gapsOn = false;

function applyGaps() {
  document.getElementById("gapsOnly").style.color = gapsOn ? "var(--warn)" : "";
  canvas.querySelectorAll("table.cov tr").forEach(tr => {
    tr.classList.toggle("dim", gapsOn && tr.dataset.st !== "none");
  });
  canvas.querySelectorAll(".items > div").forEach(d => {
    d.classList.toggle("dim", gapsOn && !d.classList.contains("empty"));
  });
  canvas.querySelectorAll("input[data-key]").forEach(i => {
    i.closest("tr").classList.toggle("dim", gapsOn && !i.classList.contains("blank"));
  });
}

document.getElementById("gapsOnly").onclick = () => { gapsOn = !gapsOn; applyGaps(); };

canvas.addEventListener("input", e => {
  const input = e.target.closest("input[data-key]");
  if (!input) return;
  const v = input.value.trim();
  if (v) store[input.dataset.key] = v; else delete store[input.dataset.key];
  input.classList.toggle("blank", !v);
  saveStore(store);
  countBlanks();
});

// 팬 / 줌
// ============================================================
const stage = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };

function apply() {
  canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}

function fit() {
  const w = canvas.scrollWidth, h = canvas.scrollHeight;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!w || !h || !sw || !sh) return;              // 패널이 아직 표시되지 않은 상태
  const k = Math.min(sw / w, sh / h);
  if (!Number.isFinite(k) || k <= 0.02) return;     // scale(0) 방지
  view = { k, x: (sw - w * k) / 2, y: Math.max(0, (sh - h * k) / 2) };
  apply();
}

document.getElementById("fit").onclick = fit;
document.getElementById("reset").onclick = () => { view = { x: 0, y: 0, k: 1 }; apply(); };

stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = Math.min(3, Math.max(0.08, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  apply();
}, { passive: false });

let drag = null;
let moved = 0;   // 이만큼 끌었으면 클릭이 아니라 이동이다 — 오진입 방지
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("input")) return;
  drag = { px: e.clientX, py: e.clientY, x: view.x, y: view.y };
  moved = 0;
  stage.classList.add("dragging");
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  view.x = drag.x + dx;
  view.y = drag.y + dy;
  apply();
});
stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); });

// ============================================================
// 검색 — 매칭 카드/항목 강조, 나머지 흐림
// ============================================================
const searchTargets = () => canvas.querySelectorAll(".card, .tgroup > .items > div, .tgroup > .gh, table.kpi tr");
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  searchTargets().forEach(el => {
    el.classList.remove("dim", "hit");
    if (!q) return;
    if (el.textContent.toLowerCase().includes(q)) el.classList.add("hit");
    else el.classList.add("dim");
  });
});

// ============================================================
// 드릴다운 — 항목 안으로 들어가 하위 체계를 세운다
// ============================================================
const drill = document.getElementById("drill");
const elTitle = document.getElementById("drillTitle");
const elNote = document.getElementById("drillNote");
let curNid = null;

function crumbHTML(nid) {
  const seg = nid.split("/");
  const parts = seg.map((_, i) => seg.slice(0, i + 1).join("/"));
  return parts.map((p, i) =>
    i === parts.length - 1
      ? `<span class="cur">${esc(titleOf(p))}</span>`
      : `<span class="c" data-go="${p}">${esc(titleOf(p))}</span><span class="sep">›</span>`
  ).join("");
}

function rowHTML(kind, idx, val, nid) {
  if (kind === "k") {
    return `<div class="row" data-kind="k" data-idx="${idx}">
      <input class="k-n" value="${esc(val.n || "")}" placeholder="지표 이름">
      <input class="k-goal" value="${esc(val.goal || "")}" placeholder="목표">
      <input class="k-cur" value="${esc(val.cur || "")}" placeholder="현재값">
      <button class="ib del" title="삭제">×</button></div>`;
  }
  if (kind === "children") {
    const childNid = val;
    const n = nodeOf(childNid);
    const count = (n.children || []).length + (n.q || []).length + (n.p || []).length + (n.k || []).length;
    return `<div class="row" data-kind="children" data-idx="${idx}" data-child="${childNid}">
      <input class="c-t" value="${esc(titleOf(childNid))}" placeholder="하위 항목 이름">
      ${count ? `<span class="cc">${count}</span>` : ""}
      <button class="ib go" title="안으로 들어가기">⤢</button>
      <button class="ib del" title="삭제">×</button></div>`;
  }
  return `<div class="row" data-kind="${kind}" data-idx="${idx}">
    <input value="${esc(val)}" placeholder="${kind === "q" ? "지금 답할 수 있어야 하는 질문" : "이 영역에서 반복되는 실패"}">
    <button class="ib del" title="삭제">×</button></div>`;
}

function fillSec(elId, kind, list) {
  const el = document.getElementById(elId);
  if (!list.length) { el.innerHTML = `<div class="none-yet">아직 없음 — 위 버튼으로 추가</div>`; return; }
  el.innerHTML = list.map((v, i) => rowHTML(kind, i, v)).join("");
}

function renderDrill() {
  const n = { children: [], q: [], p: [], k: [], note: "", ...nodeOf(curNid) };
  document.getElementById("crumb").innerHTML = crumbHTML(curNid);
  elTitle.value = titleOf(curNid);
  elTitle.readOnly = !isUserNode(curNid);
  document.getElementById("drillHint").textContent = isUserNode(curNid)
    ? "직접 만든 항목 — 제목을 고칠 수 있습니다."
    : "원본 항목 — 제목은 고정이고, 안에 하위 체계를 세울 수 있습니다.";
  elNote.value = n.note || "";
  fillSec("secChildren", "children", n.children);
  fillSec("secQ", "q", n.q);
  fillSec("secP", "p", n.p);
  fillSec("secK", "k", n.k);
}

function openNode(nid) {
  curNid = nid;
  drill.classList.add("on");
  renderDrill();
}

function closeDrill() {
  drill.classList.remove("on");
  curNid = null;
  redrawCanvas();
}

// 캔버스를 다시 그린다 — 뱃지 숫자를 갱신하되 화면 위치는 유지
function redrawCanvas() {
  const keep = { ...view };
  canvas.innerHTML = canvasHTML();
  drawWires();
  view = keep;
  apply();
  countBlanks();
  applyGaps();
}

// 캔버스에서 노드 클릭 → 진입 (지표 입력칸 클릭은 제외)
canvas.addEventListener("click", e => {
  if (moved > 6) return;                                  // 끌어서 이동한 것이므로 진입하지 않는다
  if (e.target.closest("input, table.kpi")) return;
  const el = e.target.closest("[data-nid]");
  if (el) openNode(el.dataset.nid);
});

// 브레드크럼 이동
document.getElementById("crumb").addEventListener("click", e => {
  const c = e.target.closest("[data-go]");
  if (c) openNode(c.dataset.go);
});

// 제목 / 메모 저장
elTitle.addEventListener("input", () => {
  if (!isUserNode(curNid)) return;
  const v = elTitle.value;
  mutateNode(curNid, n => ({ ...n, title: v }));
});
elNote.addEventListener("input", () => {
  const v = elNote.value;
  mutateNode(curNid, n => ({ ...n, note: v }));
});

// 추가 버튼
drill.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if (!add) return;
  const kind = add.dataset.add;
  if (kind === "children") {
    store.seq += 1;
    const childNid = `${curNid}/u${store.seq}`;
    store.nodes[childNid] = { title: "", children: [], q: [], p: [], k: [], note: "" };
    mutateNode(curNid, n => ({ ...n, children: [...n.children, childNid] }));
  } else if (kind === "k") {
    mutateNode(curNid, n => ({ ...n, k: [...n.k, { n: "", goal: "", cur: "" }] }));
  } else {
    mutateNode(curNid, n => ({ ...n, [kind]: [...n[kind], ""] }));
  }
  renderDrill();
  const rows = e.target.closest(".sec").querySelectorAll(".row input");
  if (rows.length) rows[rows.length - (kind === "k" ? 3 : 1)].focus();
});

// 행 편집 — 입력
drill.addEventListener("input", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  const kind = row.dataset.kind, idx = Number(row.dataset.idx);
  if (kind === "children") {
    const childNid = row.dataset.child;
    const v = e.target.value;
    mutateNode(childNid, n => ({ ...n, title: v }));
  } else if (kind === "k") {
    const patch = {
      n: row.querySelector(".k-n").value,
      goal: row.querySelector(".k-goal").value,
      cur: row.querySelector(".k-cur").value
    };
    mutateNode(curNid, n => ({ ...n, k: n.k.map((x, i) => (i === idx ? patch : x)) }));
  } else {
    const v = e.target.value;
    mutateNode(curNid, n => ({ ...n, [kind]: n[kind].map((x, i) => (i === idx ? v : x)) }));
  }
});

// 행 버튼 — 진입 / 삭제
drill.addEventListener("click", e => {
  const btn = e.target.closest(".ib");
  if (!btn) return;
  const row = btn.closest(".row");
  const kind = row.dataset.kind, idx = Number(row.dataset.idx);

  if (btn.classList.contains("go")) { openNode(row.dataset.child); return; }

  if (kind === "children") {
    const childNid = row.dataset.child;
    const sub = nodeOf(childNid);
    const deep = (sub.children || []).length + (sub.q || []).length + (sub.p || []).length + (sub.k || []).length;
    if (deep && !confirm(`"${titleOf(childNid)}" 안에 ${deep}개가 들어 있습니다. 함께 삭제할까요?`)) return;
    // 하위 트리 전체 제거 + 삭제 기록(다음 업데이트에 되살아나지 않게)
    Object.keys(store.nodes).forEach(k => {
      if (k === childNid || k.startsWith(childNid + "/")) delete store.nodes[k];
    });
    if (!store.removed.includes(childNid)) store.removed.push(childNid);
    mutateNode(curNid, n => ({ ...n, children: n.children.filter(c => c !== childNid) }));
  } else {
    mutateNode(curNid, n => ({ ...n, [kind]: n[kind].filter((_, i) => i !== idx) }));
  }
  renderDrill();
});

// 배경 클릭 / Esc — 상위로 또는 닫기
drill.addEventListener("click", e => { if (e.target === drill) closeDrill(); });
addEventListener("keydown", e => {
  if (e.key !== "Escape" || !drill.classList.contains("on")) return;
  if (document.activeElement && document.activeElement.closest("#drillBox")) document.activeElement.blur();
  const parent = curNid.split("/").slice(0, -1).join("/");
  if (parent) openNode(parent); else closeDrill();
});

// ============================================================
// 내보내기 / 불러오기 — 자동저장이 막힌 환경(data:, 시크릿 등) 대비
// ============================================================
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "브링_사업체계도_기록.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flash("내보냄");
};

document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();

document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (typeof data !== "object" || data === null || Array.isArray(data)) throw new Error("형식 오류");
      Object.keys(store).forEach(k => delete store[k]);
      Object.entries(data).forEach(([k, v]) => { if (typeof v === "string") store[k] = v; });
      store.nodes = (data.nodes && typeof data.nodes === "object" && !Array.isArray(data.nodes)) ? data.nodes : {};
      store.seq = typeof data.seq === "number" ? data.seq : 0;
      store.removed = Array.isArray(data.removed) ? data.removed : [];
      store.seedVersion = data.seedVersion;
      redrawCanvas();
      canvas.querySelectorAll("input[data-key]").forEach(input => {
        const v = store[input.dataset.key] || "";
        input.value = v;
        input.classList.toggle("blank", !v);
      });
      countBlanks();
      saveStore(store);
      flash("불러옴");
    } catch (error) {
      flash("불러오기 실패 — " + error.message);
    }
  };
  reader.onerror = () => flash("파일 읽기 실패");
  reader.readAsText(file);
  e.target.value = "";
};

addEventListener("resize", () => { if (view.k !== 1) fit(); });
if (!autoSaveOk) flash("자동저장 불가 — 내보내기로 보관");
requestAnimationFrame(() => { drawWires(); fit(); });
</script>
</body>
</html>
