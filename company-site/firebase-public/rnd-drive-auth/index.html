<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BRING 회사 Drive 연결</title><style>body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#f2f4f6;color:#191f28;margin:0;display:grid;place-items:center;min-height:100vh}main{max-width:440px;padding:34px;background:white;border-radius:18px;margin:20px}p{color:#4e5968;line-height:1.8}button{background:#3182f6;color:white;border:0;border-radius:12px;padding:14px 20px;font:inherit;cursor:pointer}</style></head><body><main><h2>회사 Google Drive 연결</h2><p>BRING CRM의 R&D 자료를 회사 저장소에 보관합니다. <strong>bringengineering1008@gmail.com</strong> 계정으로 연결해 주세요.</p><button id="connect">회사 Drive 인증</button><p id="status" role="status">CRM에서 시작한 연결 요청만 처리합니다.</p></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>
(()=>{const p=new URLSearchParams(location.search),port=Number(p.get('port')),state=p.get('state'),button=document.getElementById('connect'),status=document.getElementById('status');if(!Number.isInteger(port)||port<1024||port>65535||!/^[A-Za-z0-9_-]{32,128}$/.test(state??'')){button.disabled=true;status.textContent='BRING CRM에서 Drive 연결을 시작하세요.';return;}firebase.initializeApp({apiKey:'AIzaSyBKOTIuQ8pOKSuaeKFQs_6UDdDnxdjCTZg',authDomain:'bring-fm.firebaseapp.com',projectId:'bring-fm',appId:'1:864976295990:web:194f145b1b4dad58eb6097'});button.onclick=async()=>{button.disabled=true;try{const provider=new firebase.auth.GoogleAuthProvider();provider.addScope('openid');provider.addScope('email');provider.addScope('https://www.googleapis.com/auth/drive');provider.setCustomParameters({login_hint:'bringengineering1008@gmail.com',prompt:'select_account'});const result=await firebase.auth().signInWithPopup(provider);if(result.user.email!=='bringengineering1008@gmail.com')throw Error('회사 계정으로 다시 연결하세요.');const token=result.credential?.accessToken;if(!token)throw Error('Drive 인증 권한을 받지 못했습니다.');const form=document.createElement('form');form.method='POST';form.action=`http://127.0.0.1:${port}/callback`;for(const [name,value]of [['state',state],['drive_access_token',token]]){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.append(input);}document.body.append(form);form.submit();}catch(error){status.textContent=error.message;button.disabled=false;}};})();
</script></body></html>
