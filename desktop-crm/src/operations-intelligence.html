<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRING Operations Intelligence</title><link rel="stylesheet" href="./operations-intelligence.css"></head>
<body>
  <header class="hero"><div><span>BRING CARE · OPERATIONS INTELLIGENCE</span><h1>운영 인텔리전스</h1><p>업무가 어디에서 멈추고, 사람의 시간이 어디에 쓰이는지 기록합니다.</p></div><button id="newOperation" class="primary">＋ 운영 등록</button></header>
  <main>
    <section id="notice" class="notice" hidden></section>
    <section id="metrics" class="metrics"></section>
    <section class="analysis-grid"><article class="panel"><div class="panel-title"><div><span>사람 업무 분석</span><h2>개입 유형별 건수</h2></div></div><div id="interventions" class="bars"></div></article><article class="panel"><div class="panel-title"><div><span>운영 흐름</span><h2>지금 확인할 업무</h2></div></div><div id="attention" class="attention"></div></article></section>
    <section class="panel list-panel"><div class="panel-title"><div><span>OPERATIONS</span><h2>운영 기록</h2></div><div class="filters"><input id="search" type="search" placeholder="업무·건물 검색"><select id="statusFilter"><option value="">전체 상태</option></select></div></div><div id="operationList"></div></section>
  </main>
  <div id="modal" class="modal" hidden><form id="operationForm" class="dialog"><header><div><span id="formEyebrow">새 운영</span><h2 id="formTitle">운영 등록</h2></div><button type="button" class="close" data-close>×</button></header><input type="hidden" name="id"><div id="formBody"></div><footer><button type="button" data-close>취소</button><button class="primary" type="submit">서버에 저장</button></footer></form></div>
  <div id="toast" class="toast" hidden></div>
  <script src="./operations-intelligence-core.js"></script><script src="./operations-intelligence.js"></script>
</body></html>
