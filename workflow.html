<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업무 흐름 빌더 (Flow Builder)</title>
<style>
  :root{ --bg:#eef1f6; --panel:#fff; --ink:#1f2733; --ink-soft:#6b7686; --line:#c7d0dd; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{ display:flex; flex-direction:column; height:100vh; }

  header{ text-align:center; padding:14px 16px 2px; }
  header h1{ margin:0; font-size:19px; letter-spacing:-.4px; }
  .conn{ display:inline-block; margin-top:8px; padding:5px 12px; border-radius:999px; font-size:12px; border:1px solid var(--line); background:#fff; }
  .conn.local{ color:#8a6d3b; background:#fff8e6; border-color:#f0dca0; }
  .conn.on{ color:#147a3d; background:#e9f9ef; border-color:#a7e3c0; }
  .conn.off{ color:#b34700; background:#fff1e6; border-color:#f3c39a; }

  .toolbar{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:10px 16px 6px; }
  .btn{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 13px; border-radius:10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s; }
  .btn:hover{ background:#f3f6fb; }
  .btn.active{ background:#4b7bec; border-color:#4b7bec; color:#fff; }
  .help{ text-align:center; color:var(--ink-soft); font-size:12px; padding:0 16px 8px; }

  .canvas-wrap{ flex:1; position:relative; overflow:hidden; }
  svg#canvas{ width:100%; height:100%; display:block; touch-action:none; user-select:none; cursor:grab; }
  svg#canvas.panning{ cursor:grabbing; }

  .node circle{ filter:drop-shadow(0 5px 10px rgba(31,39,51,.18)); cursor:pointer; transition:filter .15s; }
  .node:hover circle{ filter:drop-shadow(0 8px 16px rgba(31,39,51,.28)); }
  body.editing .node circle{ cursor:grab; }
  svg#canvas.dragging .node circle{ cursor:grabbing; }
  .node text.lbl{ fill:#fff; font-weight:700; font-size:13px; pointer-events:none; }
  .edge{ fill:none; stroke:#b9c4d4; stroke-width:2.5; }
  .del{ cursor:pointer; }
  body:not(.editing) .del{ display:none; }

  /* 이름 수정 입력칸(원 위에 떠서 표시) */
  #renamer{ position:fixed; display:none; transform:translate(-50%,-50%); z-index:20;
    border:2px solid #4b7bec; border-radius:10px; padding:6px 10px; font-size:14px; font-weight:700;
    font-family:inherit; text-align:center; outline:none; box-shadow:0 8px 20px rgba(31,39,51,.2); width:150px; }
</style>
</head>
<body class="editing">
  <div class="stage">
    <header>
      <h1>🔵 업무 흐름 빌더</h1>
      <div><span class="conn local" id="conn">⚪ 로컬 모드</span></div>
    </header>

    <div class="toolbar">
      <button class="btn" id="addRootBtn">＋ 시작 원 추가</button>
      <button class="btn active" id="modeBtn">👁 보기 모드</button>
      <button class="btn" id="fitBtn">⊡ 화면 맞춤</button>
      <button class="btn" id="exportBtn">💾 내보내기(JSON)</button>
      <button class="btn" id="resetBtn">↺ 초기화</button>
    </div>
    <div class="help">원 <b>클릭</b> → 다음 단계 원 추가 · <b>더블클릭</b> → 이름 수정 · <b>드래그</b> → 이동 · <b>휠</b> → 확대/축소 · <b>✕</b> → 삭제</div>

    <div class="canvas-wrap">
      <svg id="canvas">
        <defs>
          <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.6" fill="#d3dae5"/>
          </pattern>
        </defs>
        <g id="viewport">
          <rect x="-4000" y="-4000" width="9000" height="9000" fill="url(#dots)"/>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <input id="renamer" maxlength="40" />
    </div>
  </div>

  <!-- Firebase (실시간 동기화용) — 키 입력 전에는 '로컬 모드'로 동작 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
/* ===== ① 실시간 공유 켜기: 아래 값을 본인 Firebase 프로젝트 값으로 교체 (교체 전엔 '로컬 모드') ===== */
const firebaseConfig = {
  apiKey:      "여기에-API-KEY",
  authDomain:  "여기에-PROJECT.firebaseapp.com",
  databaseURL: "https://여기에-PROJECT-default-rtdb.firebaseio.com",
  projectId:   "여기에-PROJECT-ID",
  appId:       "여기에-APP-ID"
};
const ROOM = "main";

const PALETTE = ["#4b7bec","#26de81","#f7b731","#fa8231","#a55eea","#eb3b5a","#2bcbba","#3867d6"];
const LS_KEY  = "fm_workflow_graph_v1";
const isConfigured = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에");

/* ===== 상태 ===== */
let nodes = {};                 // { id: {id,label,x,y,parent} }
let panX = 0, panY = 0, zoom = 1;
let db = null, graphRef = null, online = false, presenceCount = 0;
let writeTimer = null, pendingRemote = null, busy = false;

const svg      = document.getElementById("canvas");
const viewport = document.getElementById("viewport");
const edgesG   = document.getElementById("edges");
const nodesG   = document.getElementById("nodes");
const conn     = document.getElementById("conn");
const renamer  = document.getElementById("renamer");
const modeBtn  = document.getElementById("modeBtn");

const editing = () => document.body.classList.contains("editing");
const genId   = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clamp   = (v,a,b) => Math.max(a, Math.min(b, v));

/* ===== 기본(예시) 그래프 ===== */
function makeSeed(){
  return {
    r1:{ id:"r1", label:"업무 시작", x:640, y:120, parent:null },
    a1:{ id:"a1", label:"요청 접수", x:400, y:330, parent:"r1" },
    a2:{ id:"a2", label:"진행 · 실행", x:640, y:330, parent:"r1" },
    a3:{ id:"a3", label:"완료 · 전달", x:880, y:330, parent:"r1" }
  };
}

/* ===== 시작 ===== */
function start(){
  if (isConfigured && typeof firebase !== "undefined"){
    try { initFirebase(); return; } catch(e){ console.error("Firebase 실패 → 로컬", e); }
  }
  nodes = loadLocal(); updateConn(); render(); fitView();
}
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  graphRef = db.ref("workflow/"+ROOM+"/graph");
  nodes = loadLocal(); render(); fitView();
  graphRef.on("value", snap => {
    const val = snap.val();
    if (val == null){ graphRef.set(nodes); return; }   // 최초 1회 시드
    applyRemote(val);
  });
  setupPresence(); updateConn();
}

/* ===== 저장 ===== */
function loadLocal(){ try{ const g=JSON.parse(localStorage.getItem(LS_KEY)); if(g && Object.keys(g).length) return g; }catch(e){} return makeSeed(); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(nodes)); }catch(e){} }
function persist(){ if(graphRef){ graphRef.set(nodes); } else { saveLocal(); } }
function persistDebounced(){ clearTimeout(writeTimer); writeTimer = setTimeout(persist, 250); }

/* ===== 원격 반영 (내가 드래그/이름수정 중이면 잠시 보류) ===== */
function applyRemote(remote){
  if (busy){ pendingRemote = remote; return; }
  nodes = remote; render();
}
function flushPending(){ if (pendingRemote){ const r=pendingRemote; pendingRemote=null; applyRemote(r); } }

/* ===== 접속 상태 ===== */
function setupPresence(){
  const root = db.ref("workflow/"+ROOM+"/presence");
  const me = root.push();
  db.ref(".info/connected").on("value", s => { online=(s.val()===true); if(online){ me.onDisconnect().remove(); me.set(true);} updateConn(); });
  root.on("value", s => { presenceCount = s.exists()? Object.keys(s.val()).length : 0; updateConn(); });
}
function updateConn(){
  if (!graphRef){ conn.className="conn local"; conn.innerHTML="⚪ 로컬 모드 · <b>내 브라우저에만</b> 저장 (팀과 공유 안 됨)"; return; }
  if (online){ conn.className="conn on"; conn.innerHTML="🟢 실시간 연결됨 · 👥 <b>"+presenceCount+"</b>명 접속 중"; }
  else { conn.className="conn off"; conn.innerHTML="🟠 연결 끊김 — 재연결 중…"; }
}

/* ===== 보조 ===== */
function depthOf(id){ let d=0,n=nodes[id]; while(n && n.parent){ d++; n=nodes[n.parent]; if(d>50)break; } return d; }
function childrenOf(id){ return Object.values(nodes).filter(n => n.parent===id); }
function setViewport(){ viewport.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`); }

function wrapLabel(s){
  s = String(s||"");
  if (s.length <= 6) return [s];
  let cut = s.lastIndexOf(" ", Math.ceil(s.length/2));
  if (cut < 2) cut = Math.ceil(s.length/2);
  let l1 = s.slice(0, cut).trim(), l2 = s.slice(cut).trim();
  if (l2.length > 7) l2 = l2.slice(0,6) + "…";
  return [l1, l2];
}

/* ===== 렌더 ===== */
function render(){
  // 엣지
  let e = "";
  Object.values(nodes).forEach(n => {
    if (!n.parent || !nodes[n.parent]) return;
    const p = nodes[n.parent];
    const dy = n.y - p.y;
    e += `<path class="edge" d="M ${p.x} ${p.y} C ${p.x} ${p.y+dy*0.5}, ${n.x} ${n.y-dy*0.5}, ${n.x} ${n.y}"/>`;
  });
  edgesG.innerHTML = e;

  // 노드
  let h = "";
  Object.values(nodes).forEach(n => {
    const color = PALETTE[depthOf(n.id) % PALETTE.length];
    const lines = wrapLabel(n.label);
    const tspans = lines.length === 1
      ? `<tspan x="0" dy="5">${esc(lines[0])}</tspan>`
      : `<tspan x="0" dy="-3">${esc(lines[0])}</tspan><tspan x="0" dy="17">${esc(lines[1])}</tspan>`;
    h += `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})">
            <circle r="46" fill="${color}"></circle>
            <text class="lbl" text-anchor="middle">${tspans}</text>
            <g class="del" transform="translate(34,-34)">
              <circle r="11" fill="#fff" stroke="#e03131" stroke-width="1.5"></circle>
              <text text-anchor="middle" dy="4.5" font-size="14" fill="#e03131" font-weight="700">×</text>
            </g>
          </g>`;
  });
  nodesG.innerHTML = h;
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ===== 동작 ===== */
function addChild(pid){
  const p = nodes[pid]; if(!p) return;
  const id = genId();
  // 기존 원 위치는 절대 건드리지 않고, 부모 아래 '빈 자리'에만 새 원을 놓음
  let x = p.x, y = p.y + 210, guard = 0;
  while (Object.values(nodes).some(n => Math.abs(n.x-x) < 110 && Math.abs(n.y-y) < 80) && guard++ < 60) x += 120;
  nodes[id] = { id, label:"새 단계", x, y, parent:pid };
  persist(); render();
  return id;
}
function addRoot(){
  const id = genId();
  const k = childrenOf(null).length;   // 기존 루트 수
  nodes[id] = { id, label:"새 시작", x:300 + k*260, y:120, parent:null };
  persist(); render(); return id;
}
function deleteNode(id){
  const kids = collectSubtree(id);
  if (kids.length > 1 && !confirm(`'${nodes[id].label}' 와 하위 ${kids.length-1}개 원을 함께 삭제할까요?`)) return;
  kids.forEach(k => delete nodes[k]);
  persist(); render();
}
function collectSubtree(id){
  const out = [id]; let i=0;
  while(i < out.length){ childrenOf(out[i]).forEach(c => out.push(c.id)); i++; }
  return out;
}

/* ===== 이름 수정 ===== */
let renameId = null;
function startRename(id){
  const n = nodes[id]; if(!n) return;
  renameId = id; busy = true;
  const rect = svg.getBoundingClientRect();
  renamer.style.left = (rect.left + panX + n.x*zoom) + "px";
  renamer.style.top  = (rect.top  + panY + n.y*zoom) + "px";
  renamer.style.display = "block";
  renamer.value = n.label;
  renamer.focus(); renamer.select();
}
function commitRename(){
  if (renameId == null) return;
  if (nodes[renameId]){ nodes[renameId].label = renamer.value.trim() || "(이름 없음)"; }
  const id = renameId; renameId = null; renamer.style.display = "none";
  busy = false; persist(); render(); flushPending();
}
renamer.addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); commitRename(); }
  else if (e.key === "Escape"){ renameId=null; renamer.style.display="none"; busy=false; flushPending(); }
});
renamer.addEventListener("blur", commitRename);

/* ===== 클릭 vs 더블클릭(원 클릭=추가 / 더블=이름수정) ===== */
let pendingClick = null;
function nodeClicked(id){
  if (pendingClick && pendingClick.id === id){ clearTimeout(pendingClick.t); pendingClick=null; startRename(id); }
  else { const t = setTimeout(()=>{ pendingClick=null; addChild(id); }, 240); pendingClick = {id, t}; }
}

/* ===== 포인터: 노드 드래그 + 캔버스 팬 ===== */
let drag = null, pan = null;
svg.addEventListener("pointerdown", e => {
  if (renameId != null) return;
  const delEl  = e.target.closest(".del");
  const nodeEl = e.target.closest(".node");

  if (editing() && delEl && nodeEl){ e.stopPropagation(); deleteNode(nodeEl.dataset.id); return; }

  if (editing() && nodeEl){
    const n = nodes[nodeEl.dataset.id];
    drag = { id:n.id, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false };
    busy = true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  } else {
    pan = { sx:e.clientX, sy:e.clientY, px:panX, py:panY };
    svg.classList.add("panning"); svg.setPointerCapture(e.pointerId);
  }
});
svg.addEventListener("pointermove", e => {
  if (drag){
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (Math.hypot(dx,dy) > 4) drag.moved = true;
    const n = nodes[drag.id]; if(!n) return;
    n.x = drag.ox + dx/zoom; n.y = drag.oy + dy/zoom;
    render();
  } else if (pan){
    panX = pan.px + (e.clientX-pan.sx); panY = pan.py + (e.clientY-pan.sy); setViewport();
  }
});
svg.addEventListener("pointerup", e => {
  if (drag){
    if (drag.moved){ persist(); } else { nodeClicked(drag.id); }
    busy = false; drag = null; svg.classList.remove("dragging"); flushPending();
  }
  if (pan){ pan = null; svg.classList.remove("panning"); }
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const wx = (mx-panX)/zoom, wy = (my-panY)/zoom;
  zoom = clamp(zoom * (e.deltaY<0 ? 1.1 : 1/1.1), 0.4, 2.5);
  panX = mx - wx*zoom; panY = my - wy*zoom; setViewport();
}, { passive:false });

/* ===== 화면 맞춤 ===== */
function fitView(){
  const ns = Object.values(nodes); if(!ns.length) return;
  const xs = ns.map(n=>n.x), ys = ns.map(n=>n.y);
  const minX=Math.min(...xs)-90, maxX=Math.max(...xs)+90, minY=Math.min(...ys)-90, maxY=Math.max(...ys)+90;
  const rect = svg.getBoundingClientRect();
  zoom = clamp(Math.min(rect.width/(maxX-minX), rect.height/(maxY-minY)), 0.4, 1.6);
  panX = (rect.width  - (minX+maxX)*zoom)/2;
  panY = (rect.height - (minY+maxY)*zoom)/2;
  setViewport();
}

/* ===== 툴바 ===== */
document.getElementById("addRootBtn").addEventListener("click", ()=>{ if(!editing()) modeBtn.click(); const id=addRoot(); startRename(id); });
modeBtn.addEventListener("click", ()=>{
  const on = document.body.classList.toggle("editing");
  modeBtn.textContent = on ? "👁 보기 모드" : "✏️ 편집 모드";
  modeBtn.classList.toggle("active", on);
});
document.getElementById("fitBtn").addEventListener("click", fitView);
document.getElementById("resetBtn").addEventListener("click", ()=>{
  const msg = graphRef ? "기본 예시로 초기화할까요? (모든 팀원에게 적용)" : "기본 예시로 초기화할까요? (수정 내용 사라짐)";
  if (confirm(msg)){ nodes = makeSeed(); persist(); render(); fitView(); }
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(nodes,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="workflow_graph.json"; a.click();
});
window.addEventListener("resize", setViewport);

/* 테스트/디버그 훅 */
window.__wf = { addChild, addRoot, deleteNode, getNodes:()=>JSON.parse(JSON.stringify(nodes)), applyRemote, isConfigured };

start();
</script>
</body>
</html>
