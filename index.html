<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업무 흐름 빌더 (Flow Builder)</title>
<style>
  :root{ --bg:#eef1f6; --panel:#fff; --ink:#1f2733; --ink-soft:#6b7686; --line:#c7d0dd; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{ display:flex; flex-direction:column; height:100vh; }

  header{ text-align:center; padding:12px 16px 2px; }
  header h1{ margin:0; font-size:19px; letter-spacing:-.4px; }
  .conn{ display:inline-block; margin-top:7px; padding:5px 12px; border-radius:999px; font-size:12px; border:1px solid var(--line); background:#fff; }
  .conn.local{ color:#8a6d3b; background:#fff8e6; border-color:#f0dca0; }
  .conn.on{ color:#147a3d; background:#e9f9ef; border-color:#a7e3c0; }
  .conn.off{ color:#b34700; background:#fff1e6; border-color:#f3c39a; }

  .toolbar{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; padding:9px 16px 5px; }
  .btn{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 12px; border-radius:10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s; }
  .btn:hover{ background:#f3f6fb; }
  .btn.active{ background:#4b7bec; border-color:#4b7bec; color:#fff; }
  #linkBtn.active{ background:#3b5bdb; border-color:#3b5bdb; color:#fff; }
  .help{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:0 16px 7px; line-height:1.7; }
  .linkhint{ display:none; text-align:center; font-size:12.5px; color:#1b3bb3; background:#eaf0ff; border:1px solid #c5d4ff; border-radius:8px; margin:0 16px 8px; padding:7px 10px; }
  body.linking .linkhint{ display:block; }

  .canvas-wrap{ flex:1; position:relative; overflow:hidden; }
  svg#canvas{ width:100%; height:100%; display:block; touch-action:none; user-select:none; cursor:grab; }
  svg#canvas.panning{ cursor:grabbing; }
  body.linking svg#canvas{ cursor:crosshair; }

  .node circle.body{ filter:drop-shadow(0 5px 10px rgba(31,39,51,.18)); cursor:pointer; transition:filter .15s; }
  .node:hover circle.body{ filter:drop-shadow(0 8px 16px rgba(31,39,51,.28)); }
  body.editing .node circle.body{ cursor:grab; }
  body.linking .node circle.body{ cursor:crosshair; }
  svg#canvas.dragging .node circle.body{ cursor:grabbing; }
  .node text.lbl{ fill:#fff; font-weight:700; font-size:13px; pointer-events:none; }
  .edge{ fill:none; stroke:#b9c4d4; stroke-width:2.5; }
  .link{ fill:none; stroke:#3b5bdb; stroke-width:3.2; pointer-events:none; }
  .link-hit{ fill:none; stroke:transparent; stroke-width:18; cursor:pointer; }
  body:not(.editing) .link-hit{ pointer-events:none; }
  .templink{ fill:none; stroke:#3b5bdb; stroke-width:3.2; stroke-dasharray:8 5; pointer-events:none; }
  .port{ fill:#4b7bec; cursor:crosshair; }
  .swatch{ cursor:pointer; }
  body:not(.editing) .port, body:not(.editing) .swatch{ display:none; }
  .del{ cursor:pointer; }
  body:not(.editing) .del{ display:none; }

  /* 이름 수정 입력칸 */
  #renamer{ position:fixed; display:none; transform:translate(-50%,-50%); z-index:20;
    border:2px solid #4b7bec; border-radius:10px; padding:6px 10px; font-size:14px; font-weight:700;
    font-family:inherit; text-align:center; outline:none; box-shadow:0 8px 20px rgba(31,39,51,.2); width:150px; }

  /* 색·크기 팝업 */
  #nodePop{ position:fixed; display:none; z-index:25; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:8px 8px 6px; box-shadow:0 10px 26px rgba(31,39,51,.2); }
  #nodePop .poprow{ display:flex; align-items:center; flex-wrap:wrap; max-width:210px; }
  #nodePop .sw{ width:22px; height:22px; border-radius:6px; margin:3px; cursor:pointer; box-shadow:0 0 0 1px #d3dae5; }
  #nodePop .sw.reset{ width:auto; padding:0 8px; height:22px; line-height:22px; font-size:11px; color:#6b7686; background:#fff; box-shadow:0 0 0 1px #c7d0dd; }
  #nodePop .size{ margin-top:5px; }
  #nodePop .lbl2{ font-size:12px; color:#6b7686; margin:0 6px 0 3px; }
  #nodePop .szbtn{ border:1px solid var(--line); background:#fff; border-radius:7px; width:32px; height:26px; font-size:15px; cursor:pointer; margin-right:5px; }
  #nodePop .szbtn:hover{ background:#f3f6fb; }
</style>
</head>
<body class="editing">
  <div class="stage">
    <header>
      <h1>🔵 업무 흐름 빌더</h1>
      <div><span class="conn local" id="conn">⚪ 로컬 모드</span></div>
    </header>

    <div class="toolbar">
      <button class="btn" id="addRootBtn">＋ 시작 원</button>
      <button class="btn" id="linkBtn">🔗 연결 모드</button>
      <button class="btn" id="arrangeBtn">⤧ 자동정렬</button>
      <button class="btn" id="undoBtn">↩︎ 되돌리기</button>
      <button class="btn active" id="modeBtn">👁 보기 모드</button>
      <button class="btn" id="fitBtn">⊡ 화면 맞춤</button>
      <button class="btn" id="exportBtn">💾 내보내기</button>
      <button class="btn" id="resetBtn">↺ 초기화</button>
    </div>
    <div class="help">
      원 <b>클릭</b> → 중분류 추가 · <b>더블클릭</b> → 이름수정 (수정 중 <b>Ctrl+Enter</b> → 다음 원) · <b>드래그</b> → 이동 · 왼쪽위 <b>색동그라미</b> → 색·크기<br>
      <b>🔗 연결 모드</b>로 대분류끼리 잇기 · <b>Shift</b> → 자동정렬 · <b>Ctrl+Z</b> → 되돌리기 · <b>✕</b> → 삭제
    </div>
    <div class="linkhint" id="linkHint">🔗 <b>연결 모드</b> — 잇고 싶은 원을 <b>차례로 클릭</b>하면 화살표(→)로 연결돼요. 끝내려면 <b>연결 끝내기</b>를 누르세요. (이 모드에선 클릭해도 중분류가 안 생겨요)</div>

    <div class="canvas-wrap">
      <svg id="canvas">
        <defs>
          <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.6" fill="#d3dae5"/>
          </pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#3b5bdb"/>
          </marker>
        </defs>
        <g id="viewport">
          <rect x="-4000" y="-4000" width="9000" height="9000" fill="url(#dots)"/>
          <g id="edges"></g>
          <path id="tempLink" class="templink" style="display:none"></path>
          <g id="nodes"></g>
        </g>
      </svg>
      <input id="renamer" maxlength="40" />
      <div id="nodePop"></div>
    </div>
  </div>

  <!-- Firebase (실시간 동기화용) — 키 입력 전에는 '로컬 모드'로 동작 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
/* ===== ① 실시간 공유 켜기: 아래 값을 본인 Firebase 프로젝트 값으로 교체 (교체 전엔 '로컬 모드') ===== */
const firebaseConfig = {
  apiKey:      "여기에-API-KEY",
  authDomain:  "여기에-PROJECT.firebaseapp.com",
  databaseURL: "https://여기에-PROJECT-default-rtdb.firebaseio.com",
  projectId:   "여기에-PROJECT-ID",
  appId:       "여기에-APP-ID"
};
const ROOM = "main";

const PALETTE  = ["#4b7bec","#26de81","#f7b731","#fa8231","#a55eea","#eb3b5a","#2bcbba","#3867d6"];
const COLORSET = ["#4b7bec","#3867d6","#26de81","#20bf6b","#f7b731","#fa8231","#eb3b5a","#a55eea","#2bcbba","#778ca3","#1f2733"];
const LS_KEY   = "fm_workflow_graph_v1";
const isConfigured = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에");

/* ===== 상태 ===== */
let nodes = {};                 // { id:{id,label,x,y,parent,color?,r?} }
let links = [];                 // [ {from,to} ]
let panX = 0, panY = 0, zoom = 1;
let db = null, graphRef = null, online = false, presenceCount = 0;
let writeTimer = null, pendingRemote = null, busy = false;
let linkMode = false, linkSource = null, popFor = null;
let history = [], redoStack = [];

const svg      = document.getElementById("canvas");
const viewport = document.getElementById("viewport");
const edgesG   = document.getElementById("edges");
const nodesG   = document.getElementById("nodes");
const tempLink = document.getElementById("tempLink");
const conn     = document.getElementById("conn");
const renamer  = document.getElementById("renamer");
const nodePop  = document.getElementById("nodePop");
const modeBtn  = document.getElementById("modeBtn");
const linkBtn  = document.getElementById("linkBtn");
const undoBtn  = document.getElementById("undoBtn");

const editing = () => document.body.classList.contains("editing");
const genId   = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clamp   = (v,a,b) => Math.max(a, Math.min(b, v));
const radius  = n => n.r || 46;

function makeSeed(){
  return {
    r1:{ id:"r1", label:"업무 시작", x:640, y:120, parent:null },
    a1:{ id:"a1", label:"요청 접수", x:400, y:330, parent:"r1" },
    a2:{ id:"a2", label:"진행 · 실행", x:640, y:330, parent:"r1" },
    a3:{ id:"a3", label:"완료 · 전달", x:880, y:330, parent:"r1" }
  };
}

/* ===== 시작 ===== */
function start(){
  if (isConfigured && typeof firebase !== "undefined"){
    try { initFirebase(); updateUndoBtn(); return; } catch(e){ console.error("Firebase 실패 → 로컬", e); }
  }
  const d = loadLocal(); nodes = d.nodes; links = d.links; updateConn(); render(); fitView(); updateUndoBtn();
}
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  graphRef = db.ref("workflow/"+ROOM+"/graph");
  const d = loadLocal(); nodes = d.nodes; links = d.links; render(); fitView();
  graphRef.on("value", snap => {
    const val = snap.val();
    if (val == null){ graphRef.set(graphState()); return; }
    applyRemote(val);
  });
  setupPresence(); updateConn();
}

/* ===== 저장 ===== */
function graphState(){ return { nodes, links }; }
function normLinks(l){ return Array.isArray(l) ? l : (l ? Object.values(l) : []); }
function loadLocal(){
  try{
    const g = JSON.parse(localStorage.getItem(LS_KEY));
    if (g && g.nodes) return { nodes:g.nodes, links: normLinks(g.links) };
    if (g && Object.keys(g).length) return { nodes:g, links:[] };
  }catch(e){}
  return { nodes: makeSeed(), links: [] };
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(graphState())); }catch(e){} }
function persist(){ if(graphRef){ graphRef.set(graphState()); } else { saveLocal(); } }

function applyRemote(remote){
  if (busy){ pendingRemote = remote; return; }
  if (remote && remote.nodes){ nodes = remote.nodes; links = normLinks(remote.links); }
  else { nodes = remote; links = []; }
  render();
}
function flushPending(){ if (pendingRemote){ const r=pendingRemote; pendingRemote=null; applyRemote(r); } }

/* ===== 되돌리기(undo/redo) ===== */
function snapshot(){ history.push(JSON.stringify(graphState())); if(history.length>80) history.shift(); redoStack.length=0; updateUndoBtn(); }
function undo(){ if(!history.length) return; redoStack.push(JSON.stringify(graphState())); const s=JSON.parse(history.pop()); nodes=s.nodes; links=normLinks(s.links); persist(); render(); updateUndoBtn(); }
function redoOp(){ if(!redoStack.length) return; history.push(JSON.stringify(graphState())); const s=JSON.parse(redoStack.pop()); nodes=s.nodes; links=normLinks(s.links); persist(); render(); updateUndoBtn(); }
function updateUndoBtn(){ undoBtn.style.opacity = history.length ? "1" : ".45"; }

/* ===== 접속 상태 ===== */
function setupPresence(){
  const root = db.ref("workflow/"+ROOM+"/presence");
  const me = root.push();
  db.ref(".info/connected").on("value", s => { online=(s.val()===true); if(online){ me.onDisconnect().remove(); me.set(true);} updateConn(); });
  root.on("value", s => { presenceCount = s.exists()? Object.keys(s.val()).length : 0; updateConn(); });
}
function updateConn(){
  if (!graphRef){ conn.className="conn local"; conn.innerHTML="⚪ 로컬 모드 · <b>내 브라우저에만</b> 저장 (팀과 공유 안 됨)"; return; }
  if (online){ conn.className="conn on"; conn.innerHTML="🟢 실시간 연결됨 · 👥 <b>"+presenceCount+"</b>명 접속 중"; }
  else { conn.className="conn off"; conn.innerHTML="🟠 연결 끊김 — 재연결 중…"; }
}

/* ===== 보조 ===== */
function depthOf(id){ let d=0,n=nodes[id]; while(n && n.parent){ d++; n=nodes[n.parent]; if(d>50)break; } return d; }
function colorOf(n){ return n.color || PALETTE[depthOf(n.id) % PALETTE.length]; }
function childrenOf(id){ return Object.values(nodes).filter(n => n.parent===id); }
function setViewport(){ viewport.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`); }
function screenToWorld(cx, cy){ const r=svg.getBoundingClientRect(); return { x:(cx-r.left-panX)/zoom, y:(cy-r.top-panY)/zoom }; }

function wrapLabel(s){
  s = String(s||"");
  if (s.length <= 6) return [s];
  let cut = s.lastIndexOf(" ", Math.ceil(s.length/2));
  if (cut < 2) cut = Math.ceil(s.length/2);
  let l1 = s.slice(0, cut).trim(), l2 = s.slice(cut).trim();
  if (l2.length > 8) l2 = l2.slice(0,7) + "…";
  return [l1, l2];
}

/* ===== 렌더 ===== */
function render(){
  let e = "";
  Object.values(nodes).forEach(n => {
    if (!n.parent || !nodes[n.parent]) return;
    const p = nodes[n.parent]; const dy = n.y - p.y;
    e += `<path class="edge" d="M ${p.x} ${p.y} C ${p.x} ${p.y+dy*0.5}, ${n.x} ${n.y-dy*0.5}, ${n.x} ${n.y}"/>`;
  });
  links.forEach((l, i) => {
    const a = nodes[l.from], b = nodes[l.to]; if (!a || !b) return;
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    const ra=radius(a), rb=radius(b);
    const sx=a.x+ux*(ra+2), sy=a.y+uy*(ra+2), tx=b.x-ux*(rb+14), ty=b.y-uy*(rb+14);
    const mx=(sx+tx)/2, my=(sy+ty)/2;
    const d = `M ${sx} ${sy} L ${mx} ${my} L ${tx} ${ty}`;
    e += `<path class="link-hit" data-li="${i}" d="${d}"/>`;
    e += `<path class="link" marker-mid="url(#arrow)" marker-end="url(#arrow)" d="${d}"/>`;
  });
  edgesG.innerHTML = e;

  let h = "";
  Object.values(nodes).forEach(n => {
    const r = radius(n), color = colorOf(n), off = r - 12;
    const fs = clamp(Math.round(r*0.29), 11, 18);
    const lines = wrapLabel(n.label);
    const tspans = lines.length === 1
      ? `<tspan x="0" dy="${fs*0.36}">${esc(lines[0])}</tspan>`
      : `<tspan x="0" dy="${-fs*0.25}">${esc(lines[0])}</tspan><tspan x="0" dy="${fs*1.25}">${esc(lines[1])}</tspan>`;
    const sel = (n.id === linkSource) ? `<circle r="${r+8}" fill="none" stroke="#3b5bdb" stroke-width="3" stroke-dasharray="6 4"></circle>` : "";
    h += `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})">
            ${sel}
            <circle class="body" r="${r}" fill="${color}"></circle>
            <text class="lbl" text-anchor="middle" font-size="${fs}">${tspans}</text>
            <circle class="port" cx="0" cy="${r}" r="9" stroke="#fff" stroke-width="2"><title>끌어서 다른 원과 연결</title></circle>
            <circle class="swatch" cx="${-off}" cy="${-off}" r="11" fill="${color}" stroke="#fff" stroke-width="2"><title>색·크기 바꾸기</title></circle>
            <g class="del" transform="translate(${off},${-off})">
              <circle r="11" fill="#fff" stroke="#e03131" stroke-width="1.5"></circle>
              <text text-anchor="middle" dy="4.5" font-size="14" fill="#e03131" font-weight="700">×</text>
            </g>
          </g>`;
  });
  nodesG.innerHTML = h;
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ===== 동작 ===== */
function addChild(pid){
  const p = nodes[pid]; if(!p) return;
  snapshot();
  const id = genId();
  let x = p.x, y = p.y + 200, guard = 0;
  while (Object.values(nodes).some(n => Math.abs(n.x-x) < 110 && Math.abs(n.y-y) < 80) && guard++ < 60) x += 120;
  nodes[id] = { id, label:"새 단계", x, y, parent:pid };
  persist(); render();
  return id;
}
function addRoot(){
  snapshot();
  const id = genId();
  const rect = svg.getBoundingClientRect();                       // 지금 보이는 화면 정중앙(월드 좌표)
  const c = screenToWorld(rect.left + rect.width/2, rect.top + rect.height/2);
  let x = c.x, y = c.y, guard = 0;
  while (Object.values(nodes).some(n => Math.abs(n.x-x) < 120 && Math.abs(n.y-y) < 90) && guard++ < 60){ x += 130; }
  nodes[id] = { id, label:"새 시작", x, y, parent:null };
  persist(); render(); return id;
}
function addLink(from, to){
  if (!nodes[from] || !nodes[to] || from === to) return;
  if (links.some(l => (l.from===from&&l.to===to)||(l.from===to&&l.to===from))) return;
  snapshot(); links.push({ from, to }); persist(); render();
}
function deleteNode(id){
  const kids = collectSubtree(id);
  if (kids.length > 1 && !confirm(`'${nodes[id].label}' 와 하위 ${kids.length-1}개 원을 함께 삭제할까요?`)) return;
  snapshot();
  kids.forEach(k => delete nodes[k]);
  links = links.filter(l => !kids.includes(l.from) && !kids.includes(l.to));
  if (linkSource && kids.includes(linkSource)) linkSource = null;
  persist(); render();
}
function collectSubtree(id){ const out=[id]; let i=0; while(i<out.length){ childrenOf(out[i]).forEach(c=>out.push(c.id)); i++; } return out; }

function setNodeColor(id, color){ if(!nodes[id]) return; snapshot(); if(color) nodes[id].color=color; else delete nodes[id].color; persist(); render(); }
function resizeNode(id, dir){ if(!nodes[id]) return; snapshot(); nodes[id].r = clamp(radius(nodes[id]) + dir*8, 30, 88); persist(); render(); }

/* ===== 자동 정렬(트리) ===== */
function autoLayout(){
  if(!Object.keys(nodes).length) return;
  snapshot();
  const GAPX=180, GAPY=205; let leaf=0; const seen=new Set();
  function place(id, depth){
    if(seen.has(id)) return; seen.add(id);
    const kids = childrenOf(id);
    nodes[id].y = 120 + depth*GAPY;
    if(!kids.length){ nodes[id].x = leaf*GAPX; leaf++; }
    else { kids.forEach(k=>place(k.id, depth+1)); const xs=kids.map(k=>nodes[k.id].x); nodes[id].x=(Math.min(...xs)+Math.max(...xs))/2; }
  }
  Object.values(nodes).filter(n=>!n.parent||!nodes[n.parent]).forEach(r=>{ place(r.id,0); leaf++; });
  persist(); render(); fitView();
}

/* ===== 이름 수정 (Ctrl+Enter → 다음 원) ===== */
let renameId = null, renameOld = "";
function startRename(id){
  const n = nodes[id]; if(!n) return;
  renameId = id; renameOld = n.label; busy = true;
  const rect = svg.getBoundingClientRect();
  renamer.style.left = (rect.left + panX + n.x*zoom) + "px";
  renamer.style.top  = (rect.top  + panY + n.y*zoom) + "px";
  renamer.style.display = "block"; renamer.value = n.label;
  renamer.focus(); renamer.select();
}
function commitRename(){
  if (renameId == null) return;
  const id = renameId, nv = renamer.value.trim() || "(이름 없음)";
  if (nodes[id] && nodes[id].label !== nv){ snapshot(); nodes[id].label = nv; }
  renameId = null; renamer.style.display = "none"; busy = false; persist(); render(); flushPending();
}
renamer.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey||e.metaKey)){      // Ctrl+Enter → 다음 원 만들어 이어 쓰기
    e.preventDefault(); const cur = renameId; commitRename();
    if (cur){ const nid = addChild(cur); if(nid) startRename(nid); }
  } else if (e.key === "Enter"){ e.preventDefault(); commitRename(); }
  else if (e.key === "Escape"){ renameId=null; renamer.style.display="none"; busy=false; flushPending(); }
});
renamer.addEventListener("blur", commitRename);

/* ===== 클릭 처리 ===== */
let pendingClick = null;
function nodeClicked(id){
  if (linkMode){ linkClick(id); return; }
  if (pendingClick && pendingClick.id === id){ clearTimeout(pendingClick.t); pendingClick=null; startRename(id); }
  else { const t = setTimeout(()=>{ pendingClick=null; addChild(id); }, 240); pendingClick = {id, t}; }
}
function linkClick(id){
  if (!linkSource){ linkSource = id; render(); return; }
  if (id !== linkSource){ addLink(linkSource, id); }
  linkSource = id; render();
}

/* ===== 색·크기 팝업 ===== */
function openNodePop(id, e){
  popFor = id;
  nodePop.innerHTML =
    `<div class="poprow">${COLORSET.map(c=>`<span class="sw" data-c="${c}" style="background:${c}"></span>`).join("")}<span class="sw reset" data-c="">기본색</span></div>`+
    `<div class="poprow size"><span class="lbl2">크기</span><button class="szbtn" data-s="-1">－</button><button class="szbtn" data-s="1">＋</button></div>`;
  nodePop.style.left = e.clientX + "px"; nodePop.style.top = (e.clientY + 10) + "px"; nodePop.style.display = "block";
}
function hidePop(){ nodePop.style.display = "none"; popFor = null; }
nodePop.addEventListener("click", e => {
  if (popFor == null) return;
  const sw = e.target.closest(".sw"), sz = e.target.closest(".szbtn");
  if (sw) setNodeColor(popFor, sw.dataset.c || null);
  else if (sz) resizeNode(popFor, +sz.dataset.s);
});
window.addEventListener("pointerdown", e => {
  if (!e.target.closest("#nodePop") && !e.target.closest(".swatch")) hidePop();
}, true);

/* ===== 포인터 ===== */
let drag = null, pan = null, linking = null;
svg.addEventListener("pointerdown", e => {
  if (renameId != null) return;
  const delEl=e.target.closest(".del"), swatchEl=e.target.closest(".swatch"),
        portEl=e.target.closest(".port"), linkHit=e.target.closest(".link-hit"), nodeEl=e.target.closest(".node");

  if (editing() && delEl && nodeEl){ e.stopPropagation(); deleteNode(nodeEl.dataset.id); return; }
  if (editing() && swatchEl && nodeEl){ openNodePop(nodeEl.dataset.id, e); return; }
  if (editing() && linkHit){ const li=+linkHit.dataset.li; if(confirm("이 연결선을 지울까요?")){ snapshot(); links.splice(li,1); persist(); render(); } return; }
  if (editing() && !linkMode && portEl && nodeEl){
    linking = { from: nodeEl.dataset.id }; busy = true;
    const a = nodes[linking.from]; tempLink.setAttribute("d", `M ${a.x} ${a.y} L ${a.x} ${a.y}`);
    tempLink.style.display = ""; svg.setPointerCapture(e.pointerId); return;
  }
  if (editing() && nodeEl){
    const n = nodes[nodeEl.dataset.id];
    drag = { id:n.id, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false, snap:JSON.stringify(graphState()) };
    busy = true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  } else {
    pan = { sx:e.clientX, sy:e.clientY, px:panX, py:panY };
    svg.classList.add("panning"); svg.setPointerCapture(e.pointerId);
  }
});
svg.addEventListener("pointermove", e => {
  if (linking){
    const a = nodes[linking.from]; if(!a) return;
    const w = screenToWorld(e.clientX, e.clientY);
    tempLink.setAttribute("d", `M ${a.x} ${a.y} L ${w.x} ${w.y}`); return;
  }
  if (drag){
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (Math.hypot(dx,dy) > 4) drag.moved = true;
    const n = nodes[drag.id]; if(!n) return;
    n.x = drag.ox + dx/zoom; n.y = drag.oy + dy/zoom; render();
  } else if (pan){
    panX = pan.px + (e.clientX-pan.sx); panY = pan.py + (e.clientY-pan.sy); setViewport();
  }
});
svg.addEventListener("pointerup", e => {
  if (linking){
    tempLink.style.display = "none";
    const el = document.elementFromPoint(e.clientX, e.clientY); const tgt = el && el.closest(".node");
    if (tgt && tgt.dataset.id !== linking.from){ addLink(linking.from, tgt.dataset.id); }
    busy = false; linking = null; flushPending(); return;
  }
  if (drag){
    if (drag.moved){ history.push(drag.snap); if(history.length>80) history.shift(); redoStack.length=0; updateUndoBtn(); persist(); }
    else { nodeClicked(drag.id); }
    busy = false; drag = null; svg.classList.remove("dragging"); flushPending();
  }
  if (pan){ pan = null; svg.classList.remove("panning"); }
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const wx = (mx-panX)/zoom, wy = (my-panY)/zoom;
  zoom = clamp(zoom * (e.deltaY<0 ? 1.1 : 1/1.1), 0.4, 2.5);
  panX = mx - wx*zoom; panY = my - wy*zoom; setViewport();
}, { passive:false });

/* ===== 키보드: Shift 자동정렬 / Ctrl+Z 되돌리기 ===== */
let shiftFired = false;
window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || renameId != null) return;
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && (e.key === "z" || e.key === "Z")){ e.preventDefault(); e.shiftKey ? redoOp() : undo(); return; }
  if (ctrl && (e.key === "y" || e.key === "Y")){ e.preventDefault(); redoOp(); return; }
  if (e.key === "Shift" && !ctrl && !shiftFired){ shiftFired = true; if(!drag && !pan && !linking) autoLayout(); }
});
window.addEventListener("keyup", e => { if (e.key === "Shift") shiftFired = false; });

/* ===== 화면 맞춤 ===== */
function fitView(){
  const ns = Object.values(nodes); if(!ns.length) return;
  const xs = ns.map(n=>n.x), ys = ns.map(n=>n.y);
  const minX=Math.min(...xs)-100, maxX=Math.max(...xs)+100, minY=Math.min(...ys)-100, maxY=Math.max(...ys)+100;
  const rect = svg.getBoundingClientRect();
  zoom = clamp(Math.min(rect.width/(maxX-minX), rect.height/(maxY-minY)), 0.35, 1.6);
  panX = (rect.width  - (minX+maxX)*zoom)/2;
  panY = (rect.height - (minY+maxY)*zoom)/2;
  setViewport();
}

/* ===== 툴바 ===== */
document.getElementById("addRootBtn").addEventListener("click", ()=>{ if(!editing()) modeBtn.click(); const id=addRoot(); startRename(id); });
linkBtn.addEventListener("click", ()=>{
  linkMode = !linkMode;
  if (linkMode && !editing()) modeBtn.click();
  document.body.classList.toggle("linking", linkMode);
  linkBtn.classList.toggle("active", linkMode);
  linkBtn.textContent = linkMode ? "🔗 연결 끝내기" : "🔗 연결 모드";
  linkSource = null; render();
});
document.getElementById("arrangeBtn").addEventListener("click", autoLayout);
undoBtn.addEventListener("click", undo);
modeBtn.addEventListener("click", ()=>{
  const on = document.body.classList.toggle("editing");
  modeBtn.textContent = on ? "👁 보기 모드" : "✏️ 편집 모드";
  modeBtn.classList.toggle("active", on);
  if (!on && linkMode){ linkMode=false; linkSource=null; document.body.classList.remove("linking"); linkBtn.classList.remove("active"); linkBtn.textContent="🔗 연결 모드"; render(); }
});
document.getElementById("fitBtn").addEventListener("click", fitView);
document.getElementById("resetBtn").addEventListener("click", ()=>{
  const msg = graphRef ? "기본 예시로 초기화할까요? (모든 팀원에게 적용)" : "기본 예시로 초기화할까요? (수정 내용 사라짐)";
  if (confirm(msg)){ snapshot(); nodes = makeSeed(); links = []; persist(); render(); fitView(); }
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(graphState(),null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="workflow_graph.json"; a.click();
});
window.addEventListener("resize", setViewport);

/* 테스트/디버그 훅 */
window.__wf = { addChild, addRoot, addLink, deleteNode, setNodeColor, resizeNode, autoLayout, undo, redo:redoOp,
  getNodes:()=>JSON.parse(JSON.stringify(nodes)), getLinks:()=>JSON.parse(JSON.stringify(links)), applyRemote, isConfigured };

start();
</script>
</body>
