<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BRING 원주 건물 유지보수 지도</title>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=1iu68jzhci"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #top-bar {
      height: 56px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-size: 18px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: calc(100% - 56px);
    }

    .info-box {
      padding: 10px;
      min-width: 210px;
      line-height: 1.5;
      font-size: 14px;
    }

    .info-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>
  <div id="top-bar">
    BRING 원주 건물 유지보수 지도
  </div>

  <div id="map"></div>

  <script>
    const map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.3422, 127.9202),
      zoom: 13
    });

    const places = [
      {
        name: '관리 대상 건물 A',
        type: '건물',
        lat: 37.3422,
        lng: 127.9202,
        memo: '원룸 / 누수 민원 관리 대상'
      },
      {
        name: '전기업체 B',
        type: '전기',
        lat: 37.3500,
        lng: 127.9250,
        memo: '콘센트, 차단기, 조명 수리 가능'
      },
      {
        name: '설비업체 C',
        type: '설비/누수',
        lat: 37.3350,
        lng: 127.9150,
        memo: '배관, 누수, 보일러 대응 가능'
      }
    ];

    places.forEach(place => {
      const marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(place.lat, place.lng),
        map: map
      });

      const infoWindow = new naver.maps.InfoWindow({
        content: `
          <div class="info-box">
            <div class="info-title">${place.name}</div>
            <div>분류: ${place.type}</div>
            <div>메모: ${place.memo}</div>
          </div>
        `
      });

      naver.maps.Event.addListener(marker, 'click', function() {
        infoWindow.open(map, marker);
      });
    });
  </script>
</body>
</html>
