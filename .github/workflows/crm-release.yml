name: CRM Automatic Release

# This workflow publishes only the signed desktop updater artifacts. Production
# Firebase Rules go up in crm-rules-deploy.yml, which gates every deploy on the
# emulator rule tests and keeps a one-click rollback to any earlier commit.
# Keeping the two apart matters: a rules change has to reach the server the
# moment it merges, while a desktop build is a slower, signed artifact.

on:
  workflow_dispatch:

# One global queue is shared by every PC and rerun. Persistent remote claims choose
# the next unclaimed semantic version. package.json is bumped only in the generated
# release commit.
concurrency:
  group: crm-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CRM_SOURCE_BRANCH: codex/bring-field-platform

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      reservation_ref: ${{ steps.plan.outputs.reservation_ref }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_branch: ${{ steps.plan.outputs.source_branch }}
      stable_published: ${{ steps.plan.outputs.stable_published }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      package_version: ${{ steps.plan.outputs.package_version }}
      release_type: ${{ steps.plan.outputs.release_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Plan from tags, Releases, and persistent reservation refs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/plan-version.js
          --source-sha "${{ github.sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"

  reserve-build:
    if: needs.plan.outputs.stable_published != 'true'
    needs: plan
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      tag: ${{ steps.reserve.outputs.tag }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      source_branch: ${{ steps.reserve.outputs.source_branch }}
      release_sha: ${{ steps.release-meta.outputs.release_sha }}
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-crm/package-lock.json
      - name: Atomically reserve an unclaimed version, retrying fresh claims
        id: reserve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          CRM_RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
        run: >-
          node desktop-crm/scripts/release/reserve-version.js
          --version "${{ needs.plan.outputs.version }}"
          --package-version "$SOURCE_PACKAGE_VERSION"
          --release-type "$CRM_RELEASE_TYPE"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --max-attempts 10
      - name: Install CRM AI Worker dependencies
        run: npm ci
        working-directory: crm-ai-worker
      - name: Test CRM AI Worker after version reservation
        run: npm test
        working-directory: crm-ai-worker
      - name: Block artifacts containing internal weekly assignments
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: node desktop-crm/scripts/release/check-internal-data.js
      - name: Restore the exact complete draft assets on a resumed release
        if: steps.reserve.outputs.reuse_assets == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/fetch-release-assets.js
          --version "${{ steps.reserve.outputs.version }}"
          --source-sha "${{ steps.reserve.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ steps.reserve.outputs.release_sha }}"
          --assets-dir release-assets
      - name: Install desktop build dependencies without release credentials
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: npm ci
        working-directory: desktop-crm
      - name: Set release-commit-only package version
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: node desktop-crm/scripts/release/set-package-version.js --version "${{ steps.reserve.outputs.version }}"
      - if: steps.reserve.outputs.reuse_assets != 'true'
        run: npm test
        working-directory: desktop-crm
      - name: Require the BRING-FM Google Drive Desktop OAuth client ID
        if: steps.reserve.outputs.reuse_assets != 'true'
        env:
          BRING_CRM_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.BRING_CRM_GOOGLE_DRIVE_CLIENT_ID }}
        run: node desktop-crm/scripts/release/check-drive-oauth-client.js --client-id "$env:BRING_CRM_GOOGLE_DRIVE_CLIENT_ID"
      - name: Build installer with the Google Drive Desktop OAuth client ID
        if: steps.reserve.outputs.reuse_assets != 'true'
        env:
          BRING_CRM_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.BRING_CRM_GOOGLE_DRIVE_CLIENT_ID }}
        run: npm run build:win -- --publish never "-c.extraMetadata.driveOAuthClientId=$env:BRING_CRM_GOOGLE_DRIVE_CLIENT_ID"
        working-directory: desktop-crm
      - name: Verify exact installer, blockmap, and update manifest
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: node desktop-crm/scripts/release/verify-assets.js --version "${{ steps.reserve.outputs.version }}" --dist desktop-crm/dist
      - name: Create deterministic version-only release commit
        id: commit
        if: steps.reserve.outputs.release_sha == ''
        run: node desktop-crm/scripts/release/create-release-commit.js --version "${{ steps.reserve.outputs.version }}" --source-sha "${{ needs.plan.outputs.source_sha }}"
      - name: Isolate exactly the three newly built release assets
        if: steps.reserve.outputs.reuse_assets != 'true'
        shell: bash
        run: |
          mkdir release-assets
          cp "desktop-crm/dist/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe" release-assets/
          cp "desktop-crm/dist/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe.blockmap" release-assets/
          cp desktop-crm/dist/latest.yml release-assets/
      - name: Atomically create and verify annotated release tag
        if: steps.reserve.outputs.release_sha == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/finalize-release-ref.js
          --version "${{ steps.reserve.outputs.version }}"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ steps.commit.outputs.release_sha }}"
      - name: Bind the immutable artifact to the existing or newly created release commit
        id: release-meta
        shell: bash
        env:
          EXISTING_RELEASE_SHA: ${{ steps.reserve.outputs.release_sha }}
          NEW_RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
        run: |
          release_sha="$EXISTING_RELEASE_SHA"
          if [ -z "$release_sha" ]; then release_sha="$NEW_RELEASE_SHA"; fi
          test "$release_sha" != ""
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=crm-${{ steps.reserve.outputs.version }}-$release_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Verify restored or newly built release assets before upload
        run: node desktop-crm/scripts/release/verify-assets.js --version "${{ steps.reserve.outputs.version }}" --dist release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe
            release-assets/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe.blockmap
            release-assets/latest.yml

  deploy-ai-worker:
    if: needs.plan.outputs.stable_published != 'true'
    needs: [plan, reserve-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-ai-worker/package-lock.json
      - name: Install CRM AI Worker deployment dependencies
        # Read-only gate: the separately deployed Drive broker must exist first.
        run: npm ci
        working-directory: crm-ai-worker
      - name: Require deployed Drive authentication broker before publication
        run: node desktop-crm/scripts/release/check-drive-broker.js
      - name: Require account archive backend before publishing the new desktop action
        timeout-minutes: 16
        run: node desktop-crm/scripts/release/check-account-archive.js
      - name: Require the Cloudflare deployment secret without printing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) {
              console.error("Missing required GitHub Actions secret: CLOUDFLARE_API_TOKEN");
              process.exit(1);
            }
          '
      - name: Deploy CRM AI Worker while preserving production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEEKLY_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.WEEKLY_REPORT_TELEGRAM_BOT_TOKEN }}
          WEEKLY_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.WEEKLY_REPORT_TELEGRAM_CHAT_ID }}
        run: node scripts/deploy-with-weekly-secrets.mjs
        working-directory: crm-ai-worker
      - name: Verify the deployed Worker health and source version
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const source = await readFile('crm-ai-worker/src/index.js', 'utf8');
          const expectedVersion = source.match(/const SERVICE_VERSION = "([^"\r\n]+)";/)?.[1];
          if (!expectedVersion) throw new Error('Could not determine the expected Worker version.');

          const endpoint = new URL('https://bring-crm-ai-gateway.bringengineering1008.workers.dev/health');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 0; attempt < 6; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                headers: { accept: 'application/json' },
                redirect: 'error',
                signal: AbortSignal.timeout(12000),
              });
              if (!response.ok) throw new Error(`Health probe returned HTTP ${response.status}.`);
              if (!response.headers.get('content-type')?.toLowerCase().includes('application/json')) {
                throw new Error('Health probe returned an unexpected content type.');
              }
              const reader = response.body.getReader();
              const chunks = [];
              let size = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > 4096) {
                  await reader.cancel();
                  throw new Error('Health probe response exceeded 4 KiB.');
                }
                chunks.push(value);
              }
              const bytes = new Uint8Array(size);
              let offset = 0;
              for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
              const health = JSON.parse(new TextDecoder().decode(bytes));
              if (health.ok !== true || health.service !== 'bring-crm-ai-gateway' || health.version !== expectedVersion || health.weeklyReportDelivery !== true) {
                throw new Error('Deployed Worker health does not match the expected service and source version.');
              }
              console.log(`Worker health verified for source version ${expectedVersion}.`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 5) await sleep(10000);
            }
          }
          console.error(`Worker health verification failed: ${lastError?.message ?? 'unknown error'}`);
          process.exit(1);
          NODE

  stage-release:
    needs: [plan, reserve-build, deploy-ai-worker]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      already_published: ${{ steps.stage.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.reserve-build.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reserve-build.outputs.artifact_name }}
          path: release-assets
      - run: node desktop-crm/scripts/release/verify-assets.js --version "${{ needs.reserve-build.outputs.version }}" --dist release-assets
      - name: Create or resume an immutable draft and verify all three assets
        id: stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/publish-release.js
          --mode stage
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
          --assets-dir release-assets

  publish-stable:
    if: >-
      always() &&
      needs.stage-release.result == 'success' &&
      needs.stage-release.outputs.already_published != 'true'
    needs: [plan, reserve-build, deploy-ai-worker, stage-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.reserve-build.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reserve-build.outputs.artifact_name }}
          path: release-assets
      - run: node desktop-crm/scripts/release/verify-assets.js --version "${{ needs.reserve-build.outputs.version }}" --dist release-assets
      - name: Reverify refs and exact assets, then publish stable last
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/publish-release.js
          --mode publish
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
          --assets-dir release-assets
      - name: Probe the immutable public release before advancing the update channel
        run: node desktop-crm/scripts/release/probe-published-release.js --version "${{ needs.reserve-build.outputs.version }}" --attempts 6
      - name: Atomically advance the dedicated CRM update-channel pointer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/advance-update-channel.js
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
      - name: Probe the live updater channel after the pointer is visible
        run: node desktop-crm/scripts/release/probe-update-channel.js --version "${{ needs.reserve-build.outputs.version }}" --attempts 6

  repair-update-channel:
    if: needs.plan.outputs.stable_published == 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reprobe the immutable public release on a same-source retry
        run: node desktop-crm/scripts/release/probe-published-release.js --version "${{ needs.plan.outputs.version }}" --attempts 6
      - name: Repair or confirm the exact update-channel pointer atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/advance-update-channel.js
          --version "${{ needs.plan.outputs.version }}"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --release-sha "${{ needs.plan.outputs.release_sha }}"
      - name: Probe the repaired live updater channel
        run: node desktop-crm/scripts/release/probe-update-channel.js --version "${{ needs.plan.outputs.version }}" --attempts 6
