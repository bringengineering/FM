name: CRM Automatic Release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/bring-field-platform
    paths:
      - "desktop-crm/**"
      - "company-site/package.json"
      - "company-site/pnpm-lock.yaml"
      - "company-site/tests/field/database-rules.test.ts"
      - "company-site/tests/field/fixtures/database-cutover.rules.json"
      - "database.rules.json"
      - "firebase.json"
      - "release/firebase-targets.json"
      - ".github/workflows/crm-release.yml"

# One global queue is shared by every PC and rerun. Persistent remote claims choose
# the next unclaimed semantic version. package.json is bumped only in the generated
# release commit.
concurrency:
  group: crm-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CRM_SOURCE_BRANCH: codex/bring-field-platform

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      reservation_ref: ${{ steps.plan.outputs.reservation_ref }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_branch: ${{ steps.plan.outputs.source_branch }}
      stable_published: ${{ steps.plan.outputs.stable_published }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      package_version: ${{ steps.plan.outputs.package_version }}
      release_type: ${{ steps.plan.outputs.release_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Plan from tags, Releases, and persistent reservation refs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/plan-version.js
          --source-sha "${{ github.sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"

  preflight-desktop:
    if: needs.plan.outputs.stable_published != 'true'
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-crm/package-lock.json
      - run: npm ci
        working-directory: desktop-crm
      - run: npm test
        working-directory: desktop-crm

  preflight-rules:
    if: needs.plan.outputs.stable_published != 'true'
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      rules_artifact_name: ${{ steps.rules-meta.outputs.rules_artifact_name }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_BRING_FM }}
      RULES_SERVICE_ACCOUNT: ${{ vars.GCP_RULES_DEPLOY_SERVICE_ACCOUNT_BRING_FM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: company-site/pnpm-lock.yaml
      - name: Fail before reservation when production WIF is incomplete
        shell: bash
        run: |
          test "$GCP_PROJECT_ID" = "bring-fm"
          test -n "$WIF_PROVIDER"
          test -n "$RULES_SERVICE_ACCOUNT"
      - name: Validate the Spark-only automatic Database Rules target
        id: target
        run: node desktop-crm/scripts/release/read-firebase-targets.js --expected-project "$GCP_PROJECT_ID"
      - run: pnpm --dir company-site install --frozen-lockfile
      - name: Test Firebase rules in local emulators
        run: pnpm --dir company-site exec firebase --config ../firebase.json --project demo-bring-fm emulators:exec --only database,storage "pnpm test:rules"
      - name: Package the already-tested Rules bundle without credentials
        shell: bash
        run: |
          tar -czf crm-rules-deploy.tgz company-site/node_modules company-site/package.json firebase.json database.rules.json release/firebase-targets.json
          sha256sum crm-rules-deploy.tgz > crm-rules-deploy.tgz.sha256
      - name: Name the immutable Rules artifact
        id: rules-meta
        shell: bash
        run: echo "rules_artifact_name=crm-rules-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.rules-meta.outputs.rules_artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            crm-rules-deploy.tgz
            crm-rules-deploy.tgz.sha256

  preflight-wif:
    if: needs.plan.outputs.stable_published != 'true'
    needs: [plan, preflight-desktop, preflight-rules]
    runs-on: ubuntu-latest
    environment: bring-crm-production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_BRING_FM }}
      RULES_SERVICE_ACCOUNT: ${{ vars.GCP_RULES_DEPLOY_SERVICE_ACCOUNT_BRING_FM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Revalidate production configuration before requesting OIDC tokens
        shell: bash
        run: |
          test "$GCP_PROJECT_ID" = "bring-fm"
          test -n "$WIF_PROVIDER"
          test -n "$RULES_SERVICE_ACCOUNT"
      - name: Revalidate the Spark-only automatic Database Rules target
        run: node desktop-crm/scripts/release/read-firebase-targets.js --expected-project "$GCP_PROJECT_ID"
      - name: Verify Rules workload identity before any version is reserved
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RULES_SERVICE_ACCOUNT }}

  reserve-build:
    if: needs.plan.outputs.stable_published != 'true'
    needs: [plan, preflight-wif]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      tag: ${{ steps.reserve.outputs.tag }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      source_branch: ${{ steps.reserve.outputs.source_branch }}
      release_sha: ${{ steps.release-meta.outputs.release_sha }}
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-crm/package-lock.json
      - name: Atomically reserve an unclaimed version, retrying fresh claims
        id: reserve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          CRM_RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
        run: >-
          node desktop-crm/scripts/release/reserve-version.js
          --version "${{ needs.plan.outputs.version }}"
          --package-version "$SOURCE_PACKAGE_VERSION"
          --release-type "$CRM_RELEASE_TYPE"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --max-attempts 10
      - name: Restore the exact complete draft assets on a resumed release
        if: steps.reserve.outputs.reuse_assets == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/fetch-release-assets.js
          --version "${{ steps.reserve.outputs.version }}"
          --source-sha "${{ steps.reserve.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ steps.reserve.outputs.release_sha }}"
          --assets-dir release-assets
      - name: Install desktop build dependencies without release credentials
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: npm ci
        working-directory: desktop-crm
      - name: Set release-commit-only package version
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: node desktop-crm/scripts/release/set-package-version.js --version "${{ steps.reserve.outputs.version }}"
      - if: steps.reserve.outputs.reuse_assets != 'true'
        run: npm test
        working-directory: desktop-crm
      - if: steps.reserve.outputs.reuse_assets != 'true'
        run: npm run build:win -- --publish never
        working-directory: desktop-crm
      - name: Verify exact installer, blockmap, and update manifest
        if: steps.reserve.outputs.reuse_assets != 'true'
        run: node desktop-crm/scripts/release/verify-assets.js --version "${{ steps.reserve.outputs.version }}" --dist desktop-crm/dist
      - name: Create deterministic version-only release commit
        id: commit
        if: steps.reserve.outputs.release_sha == ''
        run: node desktop-crm/scripts/release/create-release-commit.js --version "${{ steps.reserve.outputs.version }}" --source-sha "${{ needs.plan.outputs.source_sha }}"
      - name: Isolate exactly the three newly built release assets
        if: steps.reserve.outputs.reuse_assets != 'true'
        shell: bash
        run: |
          mkdir release-assets
          cp "desktop-crm/dist/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe" release-assets/
          cp "desktop-crm/dist/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe.blockmap" release-assets/
          cp desktop-crm/dist/latest.yml release-assets/
      - name: Atomically create and verify annotated release tag
        if: steps.reserve.outputs.release_sha == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/finalize-release-ref.js
          --version "${{ steps.reserve.outputs.version }}"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ steps.commit.outputs.release_sha }}"
      - name: Bind the immutable artifact to the existing or newly created release commit
        id: release-meta
        shell: bash
        env:
          EXISTING_RELEASE_SHA: ${{ steps.reserve.outputs.release_sha }}
          NEW_RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
        run: |
          release_sha="$EXISTING_RELEASE_SHA"
          if [ -z "$release_sha" ]; then release_sha="$NEW_RELEASE_SHA"; fi
          test "$release_sha" != ""
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=crm-${{ steps.reserve.outputs.version }}-$release_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Verify restored or newly built release assets before upload
        run: node desktop-crm/scripts/release/verify-assets.js --version "${{ steps.reserve.outputs.version }}" --dist release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe
            release-assets/BRING.CRM.Company.Setup.${{ steps.reserve.outputs.version }}.exe.blockmap
            release-assets/latest.yml

  stage-release:
    needs: [plan, reserve-build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      already_published: ${{ steps.stage.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.reserve-build.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reserve-build.outputs.artifact_name }}
          path: release-assets
      - run: node desktop-crm/scripts/release/verify-assets.js --version "${{ needs.reserve-build.outputs.version }}" --dist release-assets
      - name: Create or resume an immutable draft and verify all three assets
        id: stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/publish-release.js
          --mode stage
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
          --assets-dir release-assets

  deploy-rules:
    # Reapply the exact tested Rules idempotently on every release. Comparing only
    # to the last public source can miss live drift after an aborted publish.
    if: needs.stage-release.outputs.already_published != 'true'
    needs: [plan, preflight-rules, reserve-build, stage-release]
    runs-on: ubuntu-latest
    environment: bring-crm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.reserve-build.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight-rules.outputs.rules_artifact_name }}
          path: rules-bundle
      - name: Restore only the credential-free tested Rules bundle
        shell: bash
        run: |
          cd rules-bundle
          sha256sum --check crm-rules-deploy.tgz.sha256
          tar -xzf crm-rules-deploy.tgz -C "$GITHUB_WORKSPACE"
      - name: Revalidate the primary project before Rules deployment
        id: target
        run: node desktop-crm/scripts/release/read-firebase-targets.js --expected-project "$GCP_PROJECT_ID"
      - name: Authenticate immediately before the Rules deployment
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_BRING_FM }}
          service_account: ${{ vars.GCP_RULES_DEPLOY_SERVICE_ACCOUNT_BRING_FM }}
      - name: Fail closed if the canonical source moved before Rules deployment
        run: node desktop-crm/scripts/release/verify-source-head.js --source-sha "${{ needs.reserve-build.outputs.source_sha }}" --source-branch "$CRM_SOURCE_BRANCH"
      - name: Deploy only Realtime Database Rules to bring-fm
        run: node company-site/node_modules/firebase-tools/lib/bin/firebase.js --config firebase.json --project "${{ steps.target.outputs.project_id }}" deploy --only database --non-interactive
      - name: Fail closed if the canonical source moved during Rules deployment
        run: node desktop-crm/scripts/release/verify-source-head.js --source-sha "${{ needs.reserve-build.outputs.source_sha }}" --source-branch "$CRM_SOURCE_BRANCH"

  publish-stable:
    if: >-
      always() &&
      needs.stage-release.result == 'success' &&
      needs.stage-release.outputs.already_published != 'true' &&
      needs.deploy-rules.result == 'success'
    needs: [plan, reserve-build, stage-release, deploy-rules]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.reserve-build.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reserve-build.outputs.artifact_name }}
          path: release-assets
      - run: node desktop-crm/scripts/release/verify-assets.js --version "${{ needs.reserve-build.outputs.version }}" --dist release-assets
      - name: Reverify refs and exact assets, then publish stable last
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/publish-release.js
          --mode publish
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --source-branch "$CRM_SOURCE_BRANCH"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
          --assets-dir release-assets
      - name: Probe the immutable public release before advancing the update channel
        run: node desktop-crm/scripts/release/probe-published-release.js --version "${{ needs.reserve-build.outputs.version }}" --attempts 6
      - name: Atomically advance the dedicated CRM update-channel pointer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/advance-update-channel.js
          --version "${{ needs.reserve-build.outputs.version }}"
          --source-sha "${{ needs.reserve-build.outputs.source_sha }}"
          --release-sha "${{ needs.reserve-build.outputs.release_sha }}"
      - name: Probe the live updater channel after the pointer is visible
        run: node desktop-crm/scripts/release/probe-update-channel.js --version "${{ needs.reserve-build.outputs.version }}" --attempts 6

  repair-update-channel:
    if: needs.plan.outputs.stable_published == 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reprobe the immutable public release on a same-source retry
        run: node desktop-crm/scripts/release/probe-published-release.js --version "${{ needs.plan.outputs.version }}" --attempts 6
      - name: Repair or confirm the exact update-channel pointer atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node desktop-crm/scripts/release/advance-update-channel.js
          --version "${{ needs.plan.outputs.version }}"
          --source-sha "${{ needs.plan.outputs.source_sha }}"
          --release-sha "${{ needs.plan.outputs.release_sha }}"
      - name: Probe the repaired live updater channel
        run: node desktop-crm/scripts/release/probe-update-channel.js --version "${{ needs.plan.outputs.version }}" --attempts 6
