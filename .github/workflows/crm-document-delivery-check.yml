name: CRM Document Delivery Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    if: github.ref == 'refs/heads/codex/bring-field-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the redacted read-only diagnostic
        run: node --test crm-ai-worker/test/document-delivery-readiness.test.js
      - name: Inspect existing production flags and binding presence only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node crm-ai-worker/scripts/check-document-delivery.mjs
