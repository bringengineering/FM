name: CRM Document Delivery Configuration Check

on:
  workflow_dispatch:
    inputs:
      cleaning_report_preflight:
        description: "Read-only cleaning report deployment access diagnostic"
        type: boolean
        default: false
  push:
    branches: [codex/bring-field-platform]
    paths:
      - .github/workflows/crm-document-delivery-check.yml
      - crm-ai-worker/scripts/check-document-delivery.mjs

permissions:
  contents: read

jobs:
  configuration:
    if: github.ref == 'refs/heads/codex/bring-field-platform' && inputs.cleaning_report_preflight != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the redacted read-only diagnostic
        run: node --test crm-ai-worker/test/document-delivery-readiness.test.js
      - name: Inspect existing production flags and binding presence only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node crm-ai-worker/scripts/check-document-delivery.mjs

  cleaning-report-preflight:
    if: github.ref == 'refs/heads/codex/bring-field-platform' && inputs.cleaning_report_preflight == true
    runs-on: ubuntu-latest
    environment: firebase-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm --dir company-site install --frozen-lockfile
      - run: node --test release/crm-cleaning-report-deployment.test.cjs
      - name: Read function API status without deploying or exposing credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node release/crm-cleaning-report-deployment.cjs --preflight
