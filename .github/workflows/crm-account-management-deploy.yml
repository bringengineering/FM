name: CRM Account Management Deploy
on:
  workflow_dispatch:
    inputs:
      expected_hash:
        description: Existing management Functions hash, required only when replacing an existing deployment
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: crm-production-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/bring-field-platform'
    runs-on: ubuntu-latest
    environment: firebase-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm --dir functions install --frozen-lockfile
      - run: pnpm --dir company-site install --frozen-lockfile
      - run: pnpm --dir functions test
      - run: pnpm --dir functions build
      - run: node --test release/crm-account-management-deployment.test.cjs
      - name: Verify management roles and deletion only in isolated emulators
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          CRM_ACCOUNT_SETUP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
        run: pnpm --dir company-site exec firebase --config ../firebase.account-setup-emulators.json --project demo-bring-fm-account-setup emulators:exec --only auth,database,functions "pnpm --dir ../functions exec vitest run test/crm-account-invite-emulator.test.ts"
      - name: Deploy exactly the three administrator-only management callables
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED_MANAGEMENT_HASH: ${{ inputs.expected_hash }}
        run: node release/crm-account-management-deployment.cjs --apply ${EXPECTED_MANAGEMENT_HASH:+--expected-hash "$EXPECTED_MANAGEMENT_HASH"}
      - run: node desktop-crm/scripts/release/check-account-management.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: crm-account-management-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/crm-account-management-deploy/
          if-no-files-found: ignore
          retention-days: 30
